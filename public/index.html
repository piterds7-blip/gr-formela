    if(!m.length)continue;
    const fk=f.length?avg(f)/1000:0,mk=avg(m);
    const expd=Math.max(0,(mk-s.tmrMleko)*s.kgPaszyNaKgMleka);
    rows.push({id,fk,mk,fdays:f.length,expd,diff:fk-expd,dim:(ser[R]||{}).dim});
  }
  const st=rows.filter(r=>r.fdays>0);
  const adult=r=>r.dim==null||r.dim>=21;
  const over=st.filter(r=>r.diff>1&&adult(r)).sort((a,b)=>b.diff-a.diff),under=st.filter(r=>r.diff<-1&&adult(r)).sort((a,b)=>a.diff-b.diff);
  const overKg=over.reduce((a,r)=>a+r.diff-1,0);
  const lnk=ixL();
  const g1No=Object.values(S.farm.cows).filter(c=>c.aktywna!==false&&gOf(c)==='g1').map(c=>({c,id:lnk.app2ix[c.kolczyk]})).filter(x=>x.id&&!st.find(r=>r.id===x.id)&&rows.find(r=>r.id===x.id));
  const num=(k,l,step)=>`<label class="f">${l}<input type="number" step="${step}" data-zs2="${k}" value="${s[k]}"></label>`;
  const tbl=(l,id)=>{const lim=S.zMore===id?1e9:10;return `<div class="tbl-wrap"><table><thead><tr><th>Krowa</th><th class="n">Mleko (śr. 7 dni)</th><th class="n">Pasza ze stacji</th><th class="n">Wg reguły</th><th class="n">Różnica</th><th class="n">Dzień lakt.</th></tr></thead><tbody>
    ${l.slice(0,lim).map(r=>`<tr data-ix="${esc(r.id)}"><td><b>${esc(ixNr(r.id))}</b></td><td class="n">${fNum(r.mk)}</td><td class="n">${fNum(r.fk)} kg</td><td class="n">${fNum(r.expd)} kg</td><td class="n ${r.diff>0?'bad':'warn'}">${r.diff>0?'+':''}${fNum(r.diff)} kg</td><td class="n">${r.dim??'–'}</td></tr>`).join('')}</tbody></table></div>${l.length>lim?`<button class="btn sm" style="margin-top:8px" data-more="${id}">Pokaż wszystkie (${l.length})</button>`:''}`;};
  el.innerHTML=`<div class="card"><h2>Stacja paszowa – ostatnie 7 dni</h2>
    <p class="muted">Paszę ze stacji pobiera <b>${st.length}</b> krów, średnio ${fNum(avg(st.map(r=>r.fk)))} kg/dzień. Reguła: TMR pokrywa ${s.tmrMleko} kg mleka, a każdy kg mleka ponad to ${fNum(s.kgPaszyNaKgMleka,2)} kg paszy treściwej. Zmień ją do swojej dawki.</p>
    <div class="grid2">${num('tmrMleko','TMR pokrywa (kg mleka)',1)}${num('kgPaszyNaKgMleka','kg paszy na 1 kg mleka',0.05)}${num('cenaPaszy','Cena paszy (zł/kg)',0.05)}</div>
    <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" id="zsSave">Przelicz i zapisz</button></div>
    <div class="chart-box" style="margin-top:12px"><canvas id="sCh"></canvas></div>

    <p class="muted">Każdy punkt to krowa korzystająca ze stacji. Linia: Twoja reguła. Krowy do 21 dnia laktacji pomijam, bo są w trakcie rozdajania.</p>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><span class="muted">Za dużo paszy</span><b>${over.length} krów</b><span class="muted">nadwyżka ~${fNum(overKg)} kg/dzień</span></div>
      <div class="kpi"><span class="muted">Możliwa oszczędność</span><b>${fNum(overKg*s.cenaPaszy*30,0)} zł</b><span class="muted">miesięcznie, przy ${fNum(s.cenaPaszy,2)} zł/kg</span></div>
      <div class="kpi"><span class="muted">Za mało paszy</span><b>${under.length} krów</b><span class="muted">wydajność wyższa, niż wynika z dawki ze stacji</span></div>
    </div></div>
  ${(()=>{const L=doseVsRule();if(!L)return'';const big=L.filter(r=>r.diff!=null&&Math.abs(r.diff)>=1&&!r.fresh);
      return`<div class="card"><div class="row"><h2 style="margin:0">Grupa 1: dawka w Infodexie a zasada (${big.length})</h2><span class="spacer"></span><button class="btn sm" id="dvrPrint">Drukuj</button></div>
      <p class="muted">Dawka ustawiona w Infodexie na dziś (wzorzec krowy lub grupy, z tabelą mleczną) porównana z Twoją zasadą: TMR na ${s.tmrMleko} kg mleka, potem ${fNum(s.kgPaszyNaKgMleka,2)} kg paszy na kg mleka. Pokazuję różnice od 1 kg, bez krów do 21. dnia laktacji (rozdajanie).</p>
      ${big.length?`<div class="tbl-wrap"><table id="dvrT"><thead><tr><th>Krowa</th><th class="n">Dzień lakt.</th><th class="n">Mleko 7 dni</th><th class="n">Dawka Infodex</th><th class="n">Wg zasady</th><th class="n">Różnica</th></tr></thead><tbody>
      ${big.map(r=>`<tr data-ix="${esc(r.id)}"><td><b>${esc(r.nr??'?')}</b></td><td class="n">${r.dim??'–'}</td><td class="n">${fNum(r.m7,1)}</td><td class="n">${fNum(r.dose,1)}</td><td class="n">${fNum(r.rule,1)}</td><td class="n ${r.diff>0?'warn':'bad'}">${r.diff>0?'+':''}${fNum(r.diff,1)}</td></tr>`).join('')}</tbody></table></div>`:'<p>Dawki zgadzają się z zasadą (różnice poniżej 1 kg).</p>'}</div>`})()}
  <div class="card"><h2>Za dużo paszy wg reguły (${over.length})</h2>${over.length?tbl(over,'o'):'<p>Brak.</p>'}</div>
  <div class="card"><h2>Za mało paszy wg reguły (${under.length})</h2>${under.length?tbl(under,'u'):'<p>Brak.</p>'}</div>
  ${g1No.length?`<div class="card"><h2>W Grupie 1, a nie pobierają paszy ze stacji (${g1No.length})</h2><p class="muted">Grupa 1 ma dostęp do stacji. Te krowy przez 7 dni nic nie pobrały: sprawdź responder, dawkę w Infodexie albo przydział do grupy.</p><div class="ids">${g1No.map(x=>nrLink(x.id)).join('')}</div></div>`:''}`;
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{S.zMore=b.dataset.more;render()});
  const mx=Math.max(50,...st.map(r=>r.mk));
  S.charts.push(new Chart($('#sCh'),{type:'scatter',data:{datasets:[
    {label:'Krowy',data:st.filter(adult).map(r=>({x:r.mk,y:r.fk,id:r.id})),backgroundColor:st.filter(adult).map(r=>r.diff>1?'#B3392C':r.diff<-1?'#B08A12':'#2F6B3A'),pointRadius:5},
    {type:'line',label:'Reguła',data:[{x:0,y:0},{x:s.tmrMleko,y:0},{x:mx,y:(mx-s.tmrMleko)*s.kgPaszyNaKgMleka}],borderColor:'#3F6385',borderDash:[6,4],pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,onClick:(e,els)=>{const el=els.find(x=>x.datasetIndex===0);if(el)openIxCow(st.filter(adult)[el.index].id)},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.id?`Krowa ${ixNr(c.raw.id)}: ${fNum(c.raw.x)} kg mleka, ${fNum(c.raw.y)} kg paszy`:''}}},
      scales:{x:{min:0,title:{display:true,text:'mleko kg/dzień (śr. 7 dni)'}},y:{min:0,title:{display:true,text:'pasza ze stacji kg/dzień'}}}}}));
  {const b=$('#dvrPrint');if(b)b.onclick=()=>{const t=$('#dvrT');const w=window.open('','_blank');if(!w)return;w.document.write(`<html><head><meta charset="utf-8"><title>Dawki stacji</title><style>body{font-family:Segoe UI,Arial;font-size:14px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px 8px;text-align:right}td:first-child,th:first-child{text-align:left}</style></head><body><h2>${esc(S.farm.name)} – dawki stacji do sprawdzenia, ${fDate(todayISO())}</h2>${t?t.outerHTML:'Brak różnic.'}<script>window.print()<\/script></body></html>`);w.document.close()}}
  $('#zsSave').onclick=async()=>{const ns={...s};document.querySelectorAll('[data-zs2]').forEach(i=>{const v=parseFloat(i.value);if(!isNaN(v))ns[i.dataset.zs2]=v});
    if(await commit({meta:{settings:ns}})){S.farm.settings=ns;toast('Zapisano');render()}};
}
function zSklad(el){
  const D=IX.d,R=D.ref,tests=Object.values(S.farm.tests||{}).sort((a,b)=>a.date.localeCompare(b.date));
  if(!tests.length){el.innerHTML='<div class="card"><h2>Skład mleka</h2><p>Wgraj próbny dój (zakładka Próbne doje), a połączę skład mleka z codzienną wydajnością z Infodexu.</p></div>';return}
  const L=ixL();
  const comp={};tests.forEach(t=>{const m={};(t.rows||[]).forEach(r=>{if(r.tl&&r.bi)m[r.kolczyk]={tl:r.tl,bi:r.bi}});comp[t.date]=m});
  const tdates=tests.map(t=>t.date);
  const near=(d)=>{let best=null,bd=1e9;tdates.forEach(t=>{const x=Math.abs(dayDiff(t,d));if(x<bd&&x<=45){bd=x;best=t}});return best};
  let days=dRange(addDays(R,-179),R).filter(d=>D.herdDay[d]);
  const fd=days.find(d=>near(d));if(fd)days=days.filter(d=>d>=fd);
  const series=days.map(d=>{const t=near(d);if(!t)return{d,m:null,ecm:null,ftp:null};const cm=comp[t];let n=0,sm=0,se=0,sf=0;
    const c=IX.days[d].c||{};for(const id in c){const k=L.ix2app[id];const x=k&&cm[k];const m=c[id].m;if(!x||!m)continue;n++;sm+=m;se+=m*(0.383*x.tl+0.242*x.bi+0.7832)/3.1138;sf+=m*(x.tl+x.bi)/100}
    return n>=10?{d,m:sm/n,ecm:se/n,ftp:sf/n,n}:{d,m:null,ecm:null,ftp:null}});
  const cal=tests.map(t=>{const diffs=[];(t.rows||[]).forEach(r=>{if(r.kg==null)return;const id=L.app2ix[r.kolczyk];const x=id&&ixRec(id,t.date);if(x&&x.m)diffs.push({d:x.m-r.kg,p:(x.m/r.kg-1)*100})});
    return{date:t.date,n:diffs.length,md:med(diffs.map(x=>x.d)),mp:med(diffs.map(x=>x.p)),big:diffs.filter(x=>Math.abs(x.p)>20).length}}).filter(x=>x.n);
  const last=series.filter(x=>x.ecm).slice(-7);
  el.innerHTML=`<div class="card"><h2>Mleko standaryzowane (ECM) – szacunek</h2>
    <p class="muted">Codzienne mleko z Infodexu razy skład (tłuszcz, białko) z najbliższego próbnego doju (do 45 dni). Pokazuje, ile „wartości” jest w mleku, a nie tylko litry.</p>
    <div class="kpis"><div class="kpi"><span class="muted">Mleko / krowę (7 dni)</span><b>${fNum(avg(last.map(x=>x.m)))} kg</b></div>
      <div class="kpi"><span class="muted">ECM / krowę (7 dni)</span><b>${fNum(avg(last.map(x=>x.ecm)))} kg</b></div>
      <div class="kpi"><span class="muted">Tłuszcz + białko / krowę</span><b>${fNum(avg(last.map(x=>x.ftp)),2)} kg</b></div></div>
    <div class="chart-box" style="margin-top:12px"><canvas id="eCh"></canvas></div>
    <p class="muted">Gdzie linia się urywa, nie było próbnego doju w promieniu 45 dni.</p></div>
  <div class="card"><h2>Kontrola: waga mleka w hali a próbny dój</h2>
    <p class="muted">Ten sam dzień i te same krowy: Infodex kontra SOL. Stała różnica w całym stadzie może oznaczać kalibrację mleczników (albo inne liczenie doby w SOL). Duże różnice u pojedynczych krów to częściej pomyłki krów albo responderów.</p>
    ${cal.length?`<div class="tbl-wrap"><table><thead><tr><th>Próbny dój</th><th class="n">Krów</th><th class="n">Mediana różnicy (Infodex − SOL)</th><th class="n">%</th><th class="n">Krów z różnicą &gt; 20%</th></tr></thead><tbody>
    ${cal.map(x=>`<tr><td>${fDate(x.date)}</td><td class="n">${x.n}</td><td class="n">${x.md>=0?'+':''}${fNum(x.md)} kg</td><td class="n ${Math.abs(x.mp)>5?'warn':''}">${x.mp>=0?'+':''}${fNum(x.mp)}%</td><td class="n">${x.big}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Brak wspólnych dni (próbny dój spoza zakresu danych z Infodexu).</p>'}</div>`;
  S.charts.push(new Chart($('#eCh'),{type:'line',data:{labels:days,datasets:[
    {label:'Mleko (kg/krowę)',data:series.map(x=>x.m),borderColor:'#8A948B',pointRadius:0,spanGaps:false},
    {label:'ECM (kg/krowę)',data:series.map(x=>x.ecm),borderColor:'#2F6B3A',pointRadius:0,borderWidth:2,spanGaps:false}]},
    plugins:[evMarks],
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'bottom'},evm:{list:tdates.map(t=>({x:days.indexOf(t),l:'PD',c:'#3F6385'})).filter(m=>m.x>=0)}},
      scales:{x:{ticks:{callback:(v,i)=>fD2(days[i]),maxTicksLimit:12}},y:{title:{display:true,text:'kg'}}}}}));
}
function zUpal(el){
  const s=S.farm.settings,D=IX.d;
  el.innerHTML=`<div class="card"><h2>Upał a mleko</h2><p class="muted">Pogoda dla gospodarstwa (${fNum(s.lat,2)}, ${fNum(s.lon,2)}) z serwisu Open-Meteo. THI łączy temperaturę i wilgotność. Od 68 krowy zaczynają odczuwać stres cieplny, od 72 jest on wyraźny.</p><div id="wxBody" class="muted">Ładuję pogodę…</div></div>`;
  wxGet().then(W=>{
    const b=$('#wxBody');if(!b)return;
    const days=D.dates.filter(d=>D.herdDay[d]&&D.herdDay[d].avg&&W[d]);
    if(!days.length){b.textContent='Brak danych pogodowych dla zakresu dat z Infodexu.';return}
    const sum=(f)=>{const l=days.filter(f);return{n:l.length,m:avg(l.map(d=>D.herdDay[d].avg))}};
    const summer=d=>{const m=+d.slice(5,7);return m>=5&&m<=9};
    const hot=sum(d=>summer(d)&&W[d].thi>=68),cool=sum(d=>summer(d)&&W[d].thi<68);
    const lag=days.filter(d=>summer(d)&&W[addDays(d,-2)]&&W[addDays(d,-2)].thi>=68);
    const lagM=avg(lag.map(d=>D.herdDay[d].avg));
    const last=days.slice(-120);
    b.className='';
    b.innerHTML=`<div class="kpis"><div class="kpi"><span class="muted">Dni z THI ≥ 68 (maj–wrzesień)</span><b>${hot.n}</b></div>
      <div class="kpi"><span class="muted">Mleko w upalne dni</span><b>${fNum(hot.m)} kg</b><span class="muted">chłodniejsze dni: ${fNum(cool.m)} kg</span></div>
      <div class="kpi"><span class="muted">2 dni po upale</span><b>${fNum(lagM)} kg</b><span class="muted">${hot.m&&cool.m?`różnica: ${fNum((lagM??hot.m)-cool.m)} kg/krowę`:''}</span></div></div>
      <div class="chart-box" style="margin-top:12px"><canvas id="wCh"></canvas></div>
      <p class="muted">Słupki: THI (czerwone ≥ 72, żółte 68–72). Linia: mleko na krowę. Spadek mleka zwykle pojawia się 1–3 dni po upale. Porównanie upalnych i chłodnych dni jest orientacyjne, bo w tym czasie zmienia się też stado i dawka.</p>`;
    S.charts.push(new Chart($('#wCh'),{type:'bar',data:{labels:last,datasets:[
      {type:'line',label:'Mleko (kg/krowę)',data:last.map(d=>D.herdDay[d].avg),borderColor:'#2F6B3A',pointRadius:0,yAxisID:'y'},
      {label:'THI',data:last.map(d=>W[d].thi),backgroundColor:last.map(d=>W[d].thi>=72?'rgba(179,57,44,.55)':W[d].thi>=68?'rgba(176,138,18,.55)':'rgba(138,148,139,.3)'),yAxisID:'y1'}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'bottom'}},
        scales:{x:{ticks:{callback:(v,i)=>fD2(last[i]),maxTicksLimit:12}},y:{title:{display:true,text:'kg/krowę'}},y1:{position:'right',min:40,grid:{drawOnChartArea:false},title:{display:true,text:'THI'}}}}}));
  }).catch(e=>{const b=$('#wxBody');if(b)b.innerHTML=`<p class="warn">Nie udało się pobrać pogody: ${esc(e.message)}. Sprawdź internet.</p>`});
}

/* ================== INSTALACJA NA TELEFONIE ================== */
let deferredInstall=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
const isMobileDev=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||isIOS();
const installHidden=()=>{const t=+localStorage.getItem('grformela.installHide')||0;return Date.now()-t<7*864e5};
function removeInstallBar(){const b=$('#installBar');if(b)b.remove()}
function showInstallBar(kind){
  if($('#installBar'))return;
  const msg={
    prompt:['Zainstaluj GR Formela na telefonie','Otwiera się wtedy jak zwykła aplikacja, na całym ekranie i z ikoną.'],
    ios:['Zainstaluj GR Formela na telefonie','Stuknij przycisk Udostępnij (kwadrat ze strzałką), potem „Dodaj do ekranu głównego”.'],
    installed:['Aplikacja jest już zainstalowana','Zamknij tę kartę i otwórz GR Formela z ikony na ekranie głównym telefonu.']
  }[kind];
  const bar=document.createElement('div');bar.id='installBar';
  bar.innerHTML=`<div class="ib-t"><b>${msg[0]}</b>${msg[1]}</div>${kind==='prompt'?'<button class="btn pri" id="ibGo">Zainstaluj</button>':''}<button class="btn" id="ibNo">${kind==='prompt'?'Później':'OK'}</button>`;
  document.querySelector('header').after(bar);
  $('#ibNo').onclick=()=>{localStorage.setItem('grformela.installHide',Date.now());removeInstallBar()};
  const go=$('#ibGo');
  if(go)go.onclick=async()=>{
    if(!deferredInstall)return;
    deferredInstall.prompt();
    try{await deferredInstall.userChoice}catch(e){}
    deferredInstall=null;removeInstallBar();
  };
}
async function maybeInstallBar(){
  if(isStandalone()||!isMobileDev()||installHidden())return;
  if(deferredInstall)return showInstallBar('prompt');
  if(isIOS())return showInstallBar('ios');
  try{
    if(navigator.getInstalledRelatedApps){
      const apps=await navigator.getInstalledRelatedApps();
      if(apps&&apps.length)showInstallBar('installed');
    }
  }catch(e){}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;maybeInstallBar()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;removeInstallBar();toast('Zainstalowano. Otwórz GR Formela z ikony na ekranie głównym.',5000)});
maybeInstallBar();

const setHdrH=()=>document.documentElement.style.setProperty('--hdrH',(document.querySelector('header').offsetHeight||48)+'px');
setHdrH();window.addEventListener('resize',setHdrH);

/* ================== SERVICE WORKER ================== */
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
