<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GR Formela</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --c-pri:#2F6B3A;--c-pri-d:#1E4A27;--c-pri-l:#E8F0E9;--c-bg:#F6F7F2;--c-card:#fff;
  --c-gold:#B08A12;--c-gold-bg:#FFF8E1;--c-red:#B3392C;--c-red-bg:#FDECEA;
  --c-blue:#3F6385;--c-blue-bg:#E7EEF5;--c-grey:#8A948B;--c-grey-bg:#EEF0EC;
  --c-txt:#1A2E1D;--c-txt2:#5A6B5C;--c-brd:#D4DDD5;--c-nav:#243E29;
  --radius:8px;--font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --g1:#2F6B3A;--g1-bg:#E8F0E9;--g2:#B08A12;--g2-bg:#FFF8E1;--zas:#3F6385;--zas-bg:#E7EEF5;--brak:#8A948B;--brak-bg:#EEF0EC;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-txt);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FB08A;outline-offset:2px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--c-nav);color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand small{font-weight:400;opacity:.7;margin-left:6px;font-size:13px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.mode{padding:3px 8px;border-radius:12px;background:#4E7355;white-space:nowrap}
.mode.local{background:#8A6D12}

nav.tabs{display:flex;gap:2px;background:var(--c-card);border-bottom:1px solid var(--c-brd);padding:0 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:25}
nav.tabs button{border:0;background:none;padding:12px 16px;color:var(--c-txt2);border-bottom:3px solid transparent;font-weight:600}
nav.tabs button.on{color:var(--c-pri);border-bottom-color:var(--c-pri)}
main{max-width:1400px;margin:0 auto;padding:16px}

.card{background:var(--c-card);border:1px solid var(--c-brd);border-radius:var(--radius);padding:16px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--c-txt2);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--c-brd);background:#fff;border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--c-pri-l)}
.btn.pri{background:var(--c-pri);border-color:var(--c-pri);color:#fff}
.btn.pri:hover{background:var(--c-pri-d)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--c-red);border-color:#E6B8B2}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--c-brd);border-radius:6px;padding:8px 10px;background:#fff;min-width:0}
input[type=search]{width:220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--c-txt2)}
label.f input,label.f select{color:var(--c-txt);font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* group chips */
.gchip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.g-g1{background:var(--g1-bg);color:var(--g1)}.g-g2{background:var(--g2-bg);color:var(--g2)}
.g-zas{background:var(--zas-bg);color:var(--zas)}.g-brak{background:var(--brak-bg);color:#5d665e}

/* suggestions */
.sug-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sug-count{font-size:28px;font-weight:800;color:var(--c-gold);line-height:1}
.sug-list{margin-top:12px;border-top:1px solid var(--c-brd)}
.sug{display:grid;grid-template-columns:28px 64px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EDF1ED}
.sug .nr{font-weight:800;font-size:18px}
.sug .why{font-size:13px;color:var(--c-txt2)}
.sug .acts{display:flex;gap:6px}
.arrow{font-weight:700}

/* board */
.board-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.coltabs{display:none;gap:6px;overflow-x:auto;margin-bottom:10px}
.coltabs button{border:1px solid var(--c-brd);background:#fff;border-radius:18px;padding:6px 12px;font-weight:600;white-space:nowrap}
.coltabs button.on{background:var(--c-txt);color:#fff;border-color:var(--c-txt)}
.coltabs button.drop,.col.drop{outline:3px dashed var(--c-pri);outline-offset:-3px;background:var(--c-pri-l);color:var(--c-txt)}
.cow{-webkit-touch-callout:none}
.cow.dragging{opacity:.35}
#dragGhost{position:fixed;z-index:70;pointer-events:none;width:240px;transform:translate(-50%,28px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:.95}
.drag-hint{display:none;font-size:12px;color:var(--c-txt2);margin:-4px 0 8px}
#sortSel{padding:8px 10px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#EEF1EC;border-radius:var(--radius);padding:8px;min-height:200px;border-top:5px solid var(--brak)}
.col[data-g=g1]{border-top-color:var(--g1)}.col[data-g=g2]{border-top-color:var(--g2)}.col[data-g=zas]{border-top-color:var(--zas)}
.col.drop{outline:3px dashed var(--c-pri);outline-offset:-3px;background:var(--c-pri-l)}
.col-h{display:flex;align-items:baseline;gap:8px;padding:4px 4px 8px}
.col-h b{font-size:15px}.col-h .n{font-size:22px;font-weight:800;margin-left:auto}
.col-h .sel-all{font-size:12px;border:0;background:none;color:var(--c-txt2);text-decoration:underline;padding:0}
.cow{background:#fff;border:1px solid var(--c-brd);border-radius:6px;padding:7px 9px;margin-bottom:6px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;user-select:none}
.cow[draggable=true]{cursor:grab}
.cow .nr{font-size:19px;font-weight:800;min-width:34px}
.cow .nm{font-size:13px;color:var(--c-txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cow .dim{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.cow .meta{grid-column:2/4;font-size:12px;color:var(--c-txt2);display:flex;gap:8px;flex-wrap:wrap}
.cow.over .dim{color:var(--c-red)}
.cow .hint{color:var(--c-gold);font-weight:700}
.cow.sel{border-color:var(--c-pri);box-shadow:0 0 0 2px var(--c-pri) inset;background:var(--c-pri-l)}
.cow.gone{opacity:.5}
.pin{font-size:12px}
:root{--lt-p:#2E8B3D;--lt-w:#2F6FB5;--lt-z:#C0392B;--st:#D9822B}
.cow.lt-p{border-left:6px solid var(--lt-p)}.cow.lt-w{border-left:6px solid var(--lt-w)}.cow.lt-z{border-left:6px solid var(--lt-z)}
.cow.lt-p .nr{color:var(--lt-p)}.cow.lt-w .nr{color:var(--lt-w)}.cow.lt-z .nr{color:var(--lt-z)}
.stb{display:inline-block;margin-left:4px;vertical-align:3px;font-size:11px;font-weight:800;line-height:16px;min-width:16px;padding:0 3px;text-align:center;border-radius:4px;background:var(--st);color:#fff;cursor:help}
.stb.bad{background:var(--c-red);color:#fff}
.stb.off{background:#fff;color:var(--c-grey);border:1px solid var(--c-grey);text-decoration:line-through;line-height:14px}
.fresh-b{background:var(--c-pri-l);color:var(--c-pri);font-weight:700;border-radius:4px;padding:0 5px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;margin:10px 2px 4px}
.lg{display:inline-flex;align-items:center;gap:6px}.lg::before{content:"";width:6px;height:16px;border-radius:2px;background:var(--c-grey)}
.lg.lt-p::before{background:var(--lt-p)}.lg.lt-w::before{background:var(--lt-w)}.lg.lt-z::before{background:var(--lt-z)}
.ltd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px;background:transparent}
.ltd.lt-p{background:var(--lt-p)}.ltd.lt-w{background:var(--lt-w)}.ltd.lt-z{background:var(--lt-z)}
.ltb{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;color:#fff}
.ltb.lt-p{background:var(--lt-p)}.ltb.lt-w{background:var(--lt-w)}.ltb.lt-z{background:var(--lt-z)}
.heat{border-left:6px solid #C2185B}.heat.none{border-left-color:var(--c-pri);padding:10px 16px}.heat-ic{font-size:22px;font-weight:800;color:#C2185B;width:28px;text-align:center}.heat.none .heat-ic{color:var(--c-pri)}.heat .aitem{border-left-color:#C2185B}
.stwarn{border-color:#E6B8B2;background:var(--c-red-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.u-r{color:var(--c-red);font-weight:700}.u-a{color:#9A7406;font-weight:700}.u-g{color:var(--c-pri);font-weight:700}
.est{color:var(--c-txt2);font-style:italic}
tr.tot td{font-weight:700;background:#F6F8F4}
tr.wrong td{background:var(--c-red-bg)}
.g1t td,.g1t th{white-space:nowrap}
.g1t td:first-child{position:sticky;left:0;background:#fff}
.g1t tr.wrong td:first-child{background:var(--c-red-bg)}
.g1t th:first-child{position:sticky;left:0;z-index:2}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--c-nav);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.selbar .sb-top{display:flex;align-items:center;gap:8px}
.selbar .sb-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px}
.selbar .btn{border:0;padding:12px 8px}
.selbar #selCancel{background:#fff;color:var(--c-txt);padding:6px 12px}
@media(max-width:860px){.selbar .sb-btns{grid-template-columns:repeat(2,1fr)}}
.b-g1{background:var(--g1);color:#fff}.b-g2{background:var(--g2);color:#fff}.b-zas{background:var(--zas);color:#fff}.b-brak{background:#6c756d;color:#fff}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--c-brd);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid #EDF1ED;text-align:left;white-space:nowrap}
th{background:#F1F4EF;font-size:12px;color:var(--c-txt2);position:sticky;top:0;cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#F7FAF6;cursor:pointer}
.bad{color:var(--c-red);font-weight:700}.warn{color:var(--c-gold);font-weight:700}

/* PD */
.drop-zone{border:2px dashed var(--c-brd);border-radius:var(--radius);padding:28px;text-align:center;background:#fff}
.drop-zone.over{border-color:var(--c-pri);background:var(--c-pri-l)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--c-brd);border-radius:6px;padding:10px}
.kpi b{display:block;font-size:22px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.chart-box{position:relative;height:320px}
.wctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:10px 0}.wctl label{display:flex;flex-direction:column;font-size:13px;color:var(--c-mut,#5E6B60);gap:3px}.wctl input{width:110px}
.wzt{min-width:0!important}.wzt td{vertical-align:middle}.wzt tr.wt-o td:nth-child(2){border-left:5px solid #3B8B4B}.wzt tr.wt-t td:nth-child(2){border-left:5px solid #C98A1B}.wzt tr.wt-m td:nth-child(2){border-left:5px solid #7E57C2}
.wzt tr.wt-o{background:#F3F8F2}.wzt tr.wt-t{background:#FDF7EC}.wzt tr.wt-m{background:#F5F1FB}.wzt .wnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#2F6B3A;color:#fff;font-size:12px;font-weight:700;margin-right:8px}
.wzt .wload b{font-size:17px;color:#1F4D2A}.wzt .wload small{display:block;color:#5E6B60;font-size:11.5px}.wzt .wcum{color:#5E6B60}.wzt .wload small.wdev{color:var(--c-red);font-weight:600}.wzt tr.tot .wload b{font-size:18px}
.woz.woz-g1{border-top:5px solid var(--g1)}.woz.woz-g2{border-top:5px solid var(--g2)}.woz.woz-zas{border-top:5px solid var(--zas)}
.wlgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:8px}.wlgd>span[class^="wt-"]{padding-left:8px}.wlgd .wt-o{border-left:5px solid #3B8B4B}.wlgd .wt-t{border-left:5px solid #C98A1B}.wlgd .wt-m{border-left:5px solid #7E57C2}
.wzd tr.wt-o td:first-child{border-left:4px solid #3B8B4B}.wzd tr.wt-t td:first-child{border-left:4px solid #C98A1B}.wzd tr.wt-m td:first-child{border-left:4px solid #7E57C2}.hlf{font-size:12px;white-space:nowrap}
.nebtn{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.tile.gtile-g1{border-top:4px solid var(--g1)}.tile.gtile-g2{border-top:4px solid var(--g2)}
.ftb{display:inline-block;margin-left:3px;vertical-align:3px;font-size:11px;font-weight:800;line-height:16px;min-width:16px;padding:0 3px;text-align:center;border-radius:4px;cursor:help}.ftb-i{background:#E3ECF7;color:#2F5F96;border:1px solid #9FB9DA}.ftb-g{background:#E8F0E9;color:#2F6B3A;border:1px solid #9CC3A3}.ftb-b{background:var(--c-red);color:#fff}.wzd select[data-ft]{width:150px}.wzd select[data-ut]{width:110px}.wzt td,.wzt th{white-space:normal}@media(max-width:600px){.wzt td,.wzt th{padding:6px 5px;font-size:13px}}
.wzd input{padding:4px 6px;font-size:13px}.wzd .w60{width:60px}.wzd .w70{width:70px}.wzd .w80{width:80px}.wzd .wn{width:100px;display:block;margin-bottom:3px}.wzd select{font-size:12px;width:100px}.wzd td,.wzd th{padding:4px 6px;vertical-align:middle}.nowrap{white-space:nowrap}
.fnotes{margin:6px 0 0;padding-left:18px;line-height:1.55}.fnotes li{margin:4px 0}.fnotes li.bad{color:var(--c-red)}.fnotes li.warn{color:#8a6100}.siara{color:#8E44AD}
.wlg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#5E6B60;margin:6px 0 8px}.wlg>span{display:flex;align-items:center;gap:6px}
.wl-d{display:inline-block;width:11px;height:11px;border-radius:50%}.wl-l{display:inline-block;width:20px;border-top:2px solid #5E6B60}.wl-l.dash{border-top-style:dashed}.wl-l.red{border-top-color:#C0392B}
tr.avgr td{border-top:2px solid #CFD8CC}tr.avgr+tr.avgr td{border-top:1px solid #E3E8E1}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.alert{border-left:4px solid var(--c-gold);background:#fff;border-radius:6px;padding:10px 12px;border:1px solid var(--c-brd);border-left-width:4px}
.alert.r{border-left-color:var(--c-red)}
.alert h4{margin:0 0 6px;font-size:14px}
.alert .ids{font-size:14px;line-height:1.7}
.alert .ids span{display:inline-block;background:var(--c-grey-bg);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;cursor:pointer}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:12px}}
.gbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.gbtns button{border:2px solid transparent;border-radius:8px;padding:14px 8px;font-weight:700;font-size:16px}
.gbtns button.cur{outline:3px solid var(--c-txt);outline-offset:2px}
.hist{font-size:13px;color:var(--c-txt2)}
.hist div{padding:3px 0;border-bottom:1px solid #EDF1ED}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--c-txt);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.login{max-width:420px;margin:12vh auto;text-align:center}

@media(max-width:860px){
  header{padding:8px 12px}.brand small{display:none}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--c-brd);border-bottom:0;padding:0 0 env(safe-area-inset-bottom,0px);justify-content:space-around}
  nav.tabs button{flex:1;padding:12px 4px;font-size:13px;border-bottom:0;border-top:3px solid transparent}
  nav.tabs button.on{border-top-color:var(--c-pri)}
  main{padding:12px 10px 90px}
  .board{grid-template-columns:1fr}
  .board .col{display:none}.board .col.mob{display:block}
  .coltabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:sticky;top:var(--hdrH,48px);z-index:20;background:var(--c-bg);padding:6px 0;margin-bottom:6px;overflow:visible}
  .coltabs button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 2px;border-radius:10px;font-size:13px}
  .coltabs button b{font-size:17px}
  .drag-hint{display:block}
  input[type=search]{width:100%}
  .sug{grid-template-columns:24px 48px 1fr;}
  .sug .acts{grid-column:2/4}
  .selbar{bottom:0}
}
@media print{
  header,nav.tabs,.no-print,.selbar{display:none!important}
  body{background:#fff}.card{border:0}
}


/* Infodex: Dziś / Żywienie */
.lbl-m{display:none}
.fresh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--c-brd);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:14px}
.fresh.old{background:var(--c-gold-bg);border-color:#E3CC7A}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--c-brd);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:28px;line-height:1.15}
.tile .sub{font-size:13px;color:var(--c-txt2)}
.tile.warnt{border-color:#E3CC7A;background:var(--c-gold-bg)}
.up{color:var(--c-pri);font-weight:700}.down{color:var(--c-red);font-weight:700}
.chart-box.sm{height:220px}
.alist{border-top:1px solid var(--c-brd)}
.aitem{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 0 10px 8px;border-bottom:1px solid #EDF1ED;border-left:4px solid var(--c-gold)}
.aitem.s3,.aitem.s4{border-left-color:var(--c-red)}
.aitem .ixc{font-size:18px;font-weight:800;text-align:center}
.rs{font-size:14px}.rs.r{color:var(--c-red);font-weight:600}.rs.a{color:#7A5F0B}
.ixc{display:inline-block;background:var(--c-grey-bg);border-radius:5px;padding:1px 7px;margin:0 4px 4px 0;cursor:pointer;font-weight:700}
.ixc:hover{background:var(--c-pri-l)}

<script>
/* ================== KONFIGURACJA FIREBASE ==================
   Projekt Firebase: gr-formela-po-app. Gdy apiKey zaczyna się od
   "WKLEJ", aplikacja działa w trybie lokalnym (dane tylko w przeglądarce). */
const firebaseConfig={
  apiKey:"AIzaSyAc-bIk_42l-U-xJBWZ6wGKbu18zeum1KE",
  authDomain:"gr-formela-po-app.firebaseapp.com",
  projectId:"gr-formela-po-app",
  storageBucket:"gr-formela-po-app.firebasestorage.app",
  messagingSenderId:"845150973868",
  appId:"1:845150973868:web:c43eccf71dcf2a23bc5409"
};
const LOCAL=!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('WKLEJ');
const APP_VER='0.11.0';
const FARM={id:'formela',name:'Formela Adam'};

/* ===== PARSER PLIKU SOL ===== */
// Parser eksportu z SOL/PFHB ("Ostatni próbny dój") -> tablica krów
const SOL_COLS={
  'kolczyk':'kolczyk','nr oborowy':'nr','nazwa':'nazwa','nr laktacji':'lakt',
  'data ost. wycielenia':'dataWyc','data ost. próbnego doju':'dataPd',
  'dni laktacji w dniu p.d.':'dimPd','kg mleka':'kg','% tłuszczu':'tl','% białka':'bi',
  '% kazeiny':'kaz','% laktozy':'lak','sucha masa':'sm','lks':'lks','mocznik':'moc',
  'tł/bi':'tb','sket':'sket','dodatkowe informacje':'info','lokalizacja':'lok'
};
function solNum(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
  return isFinite(n)?n:null;
}
function solDate(v){
  if(v===null||v===undefined||v==='')return null;
  let d=null;
  if(v instanceof Date)d=v;
  else if(typeof v==='number'){d=new Date(Math.round((v-25569)*86400000));}
  else{
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m)return `${m[1]}-${m[2]}-${m[3]}`;
    m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return null;
  }
  if(isNaN(d))return null;
  // korekta strefy: bierzemy datę lokalną + 12h, żeby uniknąć przesunięcia o dzień
  const x=new Date(d.getTime()+12*3600000);
  return x.toISOString().slice(0,10);
}
function parseSOL(rows){
  const out={rows:[],warnings:[],testDate:null,owner:null};
  let hi=rows.findIndex(r=>Array.isArray(r)&&r.some(c=>String(c||'').trim().toLowerCase()==='kolczyk'));
  if(hi<0){out.error='Nie znaleziono wiersza nagłówka z kolumną "Kolczyk". To nie wygląda na eksport próbnego doju z SOL.';return out;}
  const map={};
  rows[hi].forEach((c,i)=>{const k=SOL_COLS[String(c||'').trim().toLowerCase()];if(k)map[k]=i;});
  if(map.kolczyk===undefined){out.error='Brak kolumny "Kolczyk".';return out;}
  const dates={};
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];
    const first=String(r[0]||'');
    if(/użytkownik:/i.test(first)){const m=first.match(/użytkownik:\s*(.+)/i);if(m)out.owner=m[1].split(/\s{2,}|utworzono/i)[0].trim();continue;}
    const kol=String(r[map.kolczyk]||'').trim().replace(/\s/g,'');
    if(!kol||!/^[A-Z]{2}\d{6,}$/i.test(kol))continue;
    const g=k=>map[k]===undefined?null:r[map[k]];
    const rec={
      kolczyk:kol.toUpperCase(),
      nr:solNum(g('nr')),nazwa:g('nazwa')?String(g('nazwa')).trim():'',
      lakt:solNum(g('lakt')),dataWyc:solDate(g('dataWyc')),dataPd:solDate(g('dataPd')),
      dimPd:solNum(g('dimPd')),kg:solNum(g('kg')),tl:solNum(g('tl')),bi:solNum(g('bi')),
      kaz:solNum(g('kaz')),lak:solNum(g('lak')),sm:solNum(g('sm')),lks:solNum(g('lks')),
      moc:solNum(g('moc')),tb:solNum(g('tb')),
      sket:g('sket')===null?null:String(g('sket')).trim(),
      info:g('info')?String(g('info')).trim():''
    };
    if(rec.tb===null&&rec.tl&&rec.bi)rec.tb=Math.round(rec.tl/rec.bi*100)/100;
    if(rec.dataPd)dates[rec.dataPd]=(dates[rec.dataPd]||0)+1;
    if(rec.kg!==null&&(rec.kg<0||rec.kg>90))out.warnings.push(`Krowa ${rec.nr??rec.kolczyk}: podejrzana wydajność ${rec.kg} kg`);
    out.rows.push(rec);
  }
  const ds=Object.entries(dates).sort((a,b)=>b[1]-a[1]);
  out.testDate=ds.length?ds[0][0]:null;
  if(ds.length>1)out.warnings.push(`W pliku są różne daty próbnego doju (${ds.map(d=>d[0]).join(', ')}). Przyjęto najczęstszą: ${out.testDate}.`);
  if(!out.rows.length)out.error='Plik nie zawiera żadnej krowy z poprawnym numerem kolczyka.';
  return out;
}


/* ================== NARZĘDZIA ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const nowISO=()=>new Date().toISOString();
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fDate=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):'–';
const fNum=(v,d=1)=>v===null||v===undefined||isNaN(v)?'–':Number(v).toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const avg=a=>{const v=a.filter(x=>x!==null&&x!==undefined&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('farma-'+Date.now());
const clean=o=>JSON.parse(JSON.stringify(o));
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hidden'),ms)}

const GR={
  brak:{n:'Nieprzypisane',s:'—',cls:'brak'},
  g1:{n:'Grupa 1',s:'G1',cls:'g1'},
  g2:{n:'Grupa 2',s:'G2',cls:'g2'},
  zas:{n:'Zasuszone',s:'Zas.',cls:'zas'}
};
const GORDER=['brak','g1','g2','zas'];
const gOf=c=>c.grupa||'brak';
const chip=g=>`<span class="gchip g-${g}">${GR[g].s==='—'?'brak':GR[g].s}</span>`;

const DEF_SETTINGS={
  dimG1G2:200,dimG1G2Pierw:null,dniZasuszenia:60,ciaza:282,
  mocMin:150,mocMax:250,biMin:3.2,biMax:3.6,tbKetoza:1.5,tbSara:1.0,dimSwieze:100,lksProg:400,
  kodCiazy:1,vwp:60,badanieCiazyOd:30,alertMleko:20,alertRum:25,zmianaPomin:3,tmrMleko:25,kgPaszyNaKgMleka:0.4,cenaPaszy:1.6,lat:54.53,lon:17.7,
  limitZolty:85,limitCzerwony:70
};

/* ================== MAGAZYN DANYCH ================== */
const LocalStore={
  key:'grformela.v1',
  _d(){try{return JSON.parse(localStorage.getItem(this.key))||{farms:{}}}catch(e){return{farms:{}}}},
  _w(d){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){toast('Nie udało się zapisać w pamięci przeglądarki: '+e.message,5000)}},
  async listFarms(){const d=this._d();return Object.entries(d.farms).map(([id,f])=>({id,name:f.name}))},
  async createFarm(id,name){const d=this._d();d.farms[id]={name,settings:{...DEF_SETTINGS},cows:{},moves:[],tests:{}};this._w(d)},
  async loadFarm(id){const f=this._d().farms[id];return f?{name:f.name,settings:{...DEF_SETTINGS,...f.settings},cows:f.cows||{},moves:f.moves||[],tests:f.tests||{},zmianyDawki:f.zmianyDawki||[],woz:f.woz||null}:null},
  async commit(id,{cows=[],patches=[],moves=[],test=null,meta=null,delTest=null}){
    const d=this._d();const f=d.farms[id];if(!f)throw new Error('Brak gospodarstwa');
    cows.forEach(c=>f.cows[c.kolczyk]=clean(c));
    patches.forEach(p=>f.cows[p.k]={...(f.cows[p.k]||{kolczyk:p.k}),...clean(p.f)});
    moves.forEach(m=>f.moves.unshift(clean(m)));f.moves=f.moves.slice(0,5000);
    if(test)f.tests[test.date]=clean(test);
    if(delTest)delete f.tests[delTest];
    if(meta)Object.assign(f,clean(meta));
    this._w(d);
  }
};
let db=null;
const FireStore={
  async listFarms(){const s=await db.collection('farms').get();return s.docs.map(d=>({id:d.id,name:d.data().name}))},
  async createFarm(id,name){await db.collection('farms').doc(id).set({name,settings:{...DEF_SETTINGS},created:nowISO()})},
  async loadFarm(id){
    const fr=db.collection('farms').doc(id);
    const [f,cs,ms,ts]=await Promise.all([fr.get(),fr.collection('cows').get(),fr.collection('moves').orderBy('at','desc').limit(2000).get(),fr.collection('tests').get()]);
    if(!f.exists)return null;
    const cows={};cs.forEach(d=>cows[d.id]=d.data());
    const tests={};ts.forEach(d=>tests[d.id]=d.data());
    return{name:f.data().name,settings:{...DEF_SETTINGS,...(f.data().settings||{})},cows,moves:ms.docs.map(d=>d.data()),tests,zmianyDawki:f.data().zmianyDawki||[],woz:f.data().woz||null};
  },
  async commit(id,{cows=[],patches=[],moves=[],test=null,meta=null,delTest=null}){
    const fr=db.collection('farms').doc(id);
    const ops=[];
    cows.forEach(c=>ops.push(b=>b.set(fr.collection('cows').doc(c.kolczyk),clean(c))));
    // zapis tylko zmienionych pól krowy (merge) – nie nadpisuje zmian z innego urządzenia
    patches.forEach(p=>ops.push(b=>b.set(fr.collection('cows').doc(p.k),clean(p.f),{merge:true})));
    moves.forEach(m=>ops.push(b=>b.set(fr.collection('moves').doc(m.id),clean(m))));
    if(test)ops.push(b=>b.set(fr.collection('tests').doc(test.date),clean(test)));
    if(delTest)ops.push(b=>b.delete(fr.collection('tests').doc(delTest)));
    if(meta)ops.push(b=>b.set(fr,clean(meta),{merge:true}));
    for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  }
};
const Store=LOCAL?LocalStore:FireStore;

/* ================== STAN ================== */
const S={sortBy:localStorage.getItem('grformela.sortBy')||'dim_desc',farms:[],farmId:null,farm:null,tab:'dzis',mCharts:[],mobCol:'g1',q:'',selMode:false,sel:new Set(),sugOpen:true,
  stadoG:'all',stadoSort:{k:'nr',d:1},pdDate:null,pending:null,charts:[]};

async function commit(payload){
  try{await Store.commit(S.farmId,payload);return true}
  catch(e){console.error(e);toast('Nie zapisano: '+(e.code==='permission-denied'?'brak uprawnień do bazy.':e.message),6000);return false}
}

/* ================== REGUŁY GRUP ================== */
/* Laktacja krowy: Infodex ma pierwszeństwo, bo próbny dój (SOL) jest raz w miesiącu.
   Wpis ręczny (przycisk „Zapisz wycielenie”) wygrywa, gdy jest nowszy niż dane z Infodexu. */
const LACC=new Map();
function lac(c){
  if(LACC.has(c.kolczyk))return LACC.get(c.kolczyk);
  let r={lakt:c.lakt??null,dataWyc:c.dataWyc||null,zas:null,src:'sol',fresh:false,id:null};
  const id=ixHas()&&IXL?IXL.app2ix[c.kolczyk]:null;
  if(id){
    r.id=id;
    const x=ixLacId(id);
    if(x&&x.cd){
      const manualNewer=c.dataWyc&&c.dataWyc>addDays(x.cd,20);
      if(manualNewer)r.zas=false;
      else{
        // numer laktacji: z próbnego doju + wycielenia zapisane w Infodexie po nim (licznik Infodexu zna tylko wycielenia od instalacji)
        let lk=c.lakt!=null?c.lakt+x.calvs.filter(d=>!c.dataWyc||d>addDays(c.dataWyc,30)).length:null;
        lk=Math.max(lk||0,x.calv||0)||null;
        const fresh=(!c.dataWyc||x.cd>addDays(c.dataWyc,30))&&(!c.ostPd||x.cd>c.ostPd.date);
        r={lakt:lk,dataWyc:x.cd,zas:x.dry,src:'ix',fresh,id};
      }
    }
  }
  r.dim=r.dataWyc?dayDiff(r.dataWyc,todayISO()):null;
  LACC.set(c.kolczyk,r);return r;
}
/* typ krowy do kolorów: p = pierwiastka, w = wieloródka, z = zasuszona */
function lacType(c){const L=lac(c);if(L.zas||(L.src!=='ix'&&gOf(c)==='zas'))return 'z';if(L.lakt===1)return 'p';if(L.lakt>=2)return 'w';return ''}
const LTN={p:'pierwiastka',w:'wieloródka',z:'zasuszona'};
function dim(c){return lac(c).dim}
function pinned(c){return c.pin&&(!c.pin.do||c.pin.do>=todayISO())}
function progG1(c){const s=S.farm.settings;return(lac(c).lakt===1&&s.dimG1G2Pierw)?s.dimG1G2Pierw:s.dimG1G2}
function planWyc(c){
  if(c.plWyc)return c.plWyc;
  const L=lac(c);
  if(L.id){const rp=ixRepro(L.id);if(rp.pregnant&&rp.expCalv)return rp.expCalv}
  return null;
}
function suggestion(c){
  if(c.aktywna===false||pinned(c))return null;
  const s=S.farm.settings,g=gOf(c),L=lac(c),d=L.dim,p=progG1(c);
  const info=(c.ostPd&&c.ostPd.info||'').toLowerCase();
  const ix=L.src==='ix';
  // stan „zasuszona”: z Infodexu (bieżący), a bez Infodexu z uwag próbnego doju
  const zasInfo=ix?!!L.zas:info.includes('zasusz');
  const infoNew=ix||(c.ostPd&&(!c.grupaOd||c.ostPd.date>=c.grupaOd.slice(0,10)));
  const zasWhy=ix?'zasuszona w Infodexie':'w próbnym doju oznaczona jako zasuszona';
  const wycPoZmianie=L.dataWyc&&c.grupaOd&&L.dataWyc>c.grupaOd.slice(0,10)&&!L.zas;
  const pw=planWyc(c);
  if(g==='brak'){
    if(zasInfo)return{to:'zas',why:zasWhy};
    if(d===null)return null;
    return d<p?{to:'g1',why:`dzień laktacji ${d} (próg ${p})`}:{to:'g2',why:`dzień laktacji ${d} (próg ${p})`};
  }
  if(g==='g1'){
    if(zasInfo&&infoNew)return{to:'zas',why:zasWhy};
    if(d!==null&&d>=p)return{to:'g2',why:`dzień laktacji ${d}, próg ${p}`};
  }
  if(g==='g2'){
    if(wycPoZmianie)return{to:'g1',why:`wycielenie ${fDate(L.dataWyc)}`};
    if(zasInfo&&infoNew)return{to:'zas',why:zasWhy};
    if(pw){const left=dayDiff(todayISO(),pw);if(left<=s.dniZasuszenia)return{to:'zas',why:`do ${c.plWyc?'planowanego':'spodziewanego'} wycielenia ${left} dni`}}
  }
  if(g==='zas'){
    if(wycPoZmianie)return{to:'g1',why:`wycielenie ${fDate(L.dataWyc)}`};
  }
  return null;
}
function applyPatches(ps){LACC.clear();ps.forEach(p=>{S.farm.cows[p.k]={...(S.farm.cows[p.k]||{kolczyk:p.k}),...p.f}})}
async function moveCows(list,to,why=''){
  const at=nowISO();const patches=[],moves=[],moved=[];
  list.forEach(c=>{
    const from=gOf(c);if(from===to)return;
    patches.push({k:c.kolczyk,f:{grupa:to==='brak'?null:to,grupaOd:at,updatedAt:at}});
    moves.push({id:at.replace(/\D/g,'')+'-'+c.kolczyk,kolczyk:c.kolczyk,nr:c.nr??null,z:from,na:to,at,powod:why||''});
    moved.push(c);
  });
  if(!patches.length)return;
  if(await commit({patches,moves})){
    applyPatches(patches);S.farm.moves.unshift(...moves.reverse());
    toast(moved.length===1?`Krowa ${moved[0].nr??''} → ${GR[to].n}`:`Przeniesiono ${moved.length} krów → ${GR[to].n}`);
    render();
  }
}

/* automatyczne przeniesienia: zasuszenie i wycielenie z Infodexu, pobieranie paszy ze stacji → G1 */
function autoGroupMoves(){
  if(!ixHas()||!S.farm)return[];ixL();
  const D=IX.d,R=D.ref,out=[];
  for(const c of activeCows()){
    if(pinned(c))continue;
    const L=lac(c);if(!L.id||L.src!=='ix')continue;
    const g=gOf(c),od=(c.grupaOd||'').slice(0,10),ev=D.ev[L.id]||[];
    if(L.zas){
      if(g==='zas')continue;
      const dz=[...ev].reverse().find(e=>e.t===4),dd=dz?dz.d.slice(0,10):null;
      if(!od||!dd||dd>=od)out.push({c,to:'zas',why:`auto: zasuszenie w Infodexie${dd?' '+fDate(dd):''}`});
      continue;
    }
    if(L.dataWyc&&(g==='zas'||g==='g2')&&dayDiff(L.dataWyc,todayISO())<=60&&(od?L.dataWyc>od:true)){out.push({c,to:'g1',why:`auto: wycielenie ${fDate(L.dataWyc)} (Infodex)`});continue}
    const lm=lastMove(c);if(lm&&!moveIsAuto(lm)&&od&&dayDiff(od,todayISO())<=14)continue; // ręczna decyzja ma pierwszeństwo
    if(g!=='g1'){const ser=D.ser[L.id]||{},a=ser[R]||{},b=ser[addDays(R,-1)]||{};
      if((a.f||0)>=300&&(b.f||0)>=300&&(!od||addDays(R,-1)>od))out.push({c,to:'g1',why:`auto: pobiera paszę ze stacji (${fD2(addDays(R,-1))}–${fD2(R)})`})}
  }
  return out;
}
async function runAutoGroups(){
  if(S.autoBusy||!ixHas()||!S.farm)return;
  const key=((IX.meta&&IX.meta.at)||'')+'|'+IX.d.ref+'|'+Object.keys(S.farm.cows).length;
  if(S.autoKey===key)return;S.autoKey=key;
  const mv=autoGroupMoves();if(!mv.length)return;
  S.autoBusy=true;
  try{
    const at=nowISO(),patches=[],moves=[];
    mv.forEach(({c,to,why},i)=>{patches.push({k:c.kolczyk,f:{grupa:to,grupaOd:at,updatedAt:at}});
      moves.push({id:at.replace(/\D/g,'')+i+'-'+c.kolczyk,kolczyk:c.kolczyk,nr:c.nr??null,z:gOf(c),na:to,at,powod:why})});
    if(await commit({patches,moves})){applyPatches(patches);S.farm.moves.unshift(...moves.slice().reverse());
      toast(`Automatycznie przeniesiono ${mv.length} ${mv.length===1?'krowę':mv.length<5?'krowy':'krów'} (szczegóły w Dziś)`);render()}

}

const activeCows=()=>Object.values(S.farm.cows).filter(c=>c.aktywna!==false);
function matchQ(c){
  const q=S.q.trim().toLowerCase();if(!q)return true;
  return String(c.nr??'').startsWith(q)||(c.nazwa||'').toLowerCase().includes(q)||c.kolczyk.toLowerCase().endsWith(q)||String(c.responder||'').endsWith(q);
}
const SORTS={dim_desc:'Dni laktacji ↓',dim_asc:'Dni laktacji ↑',kg_desc:'Litry ↓',kg_asc:'Litry ↑',nr_asc:'Numer ↑'};
function sortCol(g,a,b){
  const nr=(a.nr??1e9)-(b.nr??1e9);
  const num=(x,y,dir)=>{if(x==null&&y==null)return nr;if(x==null)return 1;if(y==null)return -1;return(x-y)*dir||nr};
  switch(S.sortBy){
    case'dim_asc':return num(dim(a),dim(b),1);
    case'kg_desc':return num(kgOf(a),kgOf(b),-1);
    case'kg_asc':return num(kgOf(a),kgOf(b),1);
    case'nr_asc':return nr;
    default:return num(dim(a),dim(b),-1);
  }
}
/* mleko do list: średnia 7 dni z Infodexu, a bez niego wynik próbnego doju */
function kgOf(c){const L=lac(c);if(L.id){const v=ixMilk7(L.id);if(v!=null)return v}return c.ostPd?.kg??null}
function ixMilk7(id){const D=IX.d,ser=D.ser[id]||{};const l=dRange(addDays(D.ref,-6),D.ref).filter(d=>ser[d]&&ser[d].m>0&&!oneMilkAt(ser,d)).map(d=>ser[d].m);return l.length?avg(l):null}
/* pobór paszy ze stacji (Infodex): on = pobiera (≥0,3 kg w ostatnich 2 dniach), none3 = 3 dni bez paszy, choć jest dojona */
/* ostatnie przeniesienie krowy (z historii) */
function lastMove(c){return(S.farm.moves||[]).find(m=>m.kolczyk===c.kolczyk)||null}
const moveIsAuto=m=>!!m&&(m.powod||'').startsWith('auto:');
function moveTxt(c){const m=lastMove(c),od=(c.grupaOd||'').slice(0,10);if(!od)return'';
  return`w ${GR[gOf(c)]?GR[gOf(c)].s||GR[gOf(c)].n:gOf(c)} od ${fD2(od)} – ${m&&(m.at||'').slice(0,10)===od?(moveIsAuto(m)?'automatycznie':'ręcznie'):'ręcznie'}`}
/* dzień z prawdopodobnie jednym udojem: zapisany tylko udój 1 albo 2 ORAZ mleko < 70% mediany krowy z 7 poprzednich dni
   (sam brak jednego pola nic nie znaczy – w danych Infodexu często tak jest przy pełnej dobie) */
function oneMilkAt(ser,d){const r=ser&&ser[d];if(!r||!(r.m>0))return false;if((r.m1>0)===(r.m2>0))return false;
  const pm=dRange(addDays(d,-7),addDays(d,-1)).map(x=>ser[x]&&ser[x].m).filter(x=>x>0);return pm.length>=3&&r.m<0.7*med(pm)}
/* stacja a grupa: liczą się tylko dni PO ostatnim przeniesieniu; po ręcznym przeniesieniu z G1 – tylko pytanie, gdy je 2 dni z rzędu */
function stWrongInfo(c){
  const L=lac(c);if(!L.id||gOf(c)==='g1')return null;
  const D=IX.d,R=D.ref,ser=D.ser[L.id]||{},od=(c.grupaOd||'').slice(0,10),m=lastMove(c);
  const fA=d=>(!od||d>od)?((ser[d]||{}).f||0):0;
  const y=fA(R),y1=fA(addDays(R,-1));
  if(Math.max(y,y1)<300)return null;
  const manual=od&&m&&!moveIsAuto(m)&&m.z==='g1'&&dayDiff(od,todayISO())<=14;
  const still=y>=300&&y1>=300;
  if(manual&&!still)return null;
  return{y:y/1000,y1:y1/1000,manual,still,od};
}
function stInfo(id){
  const D=IX.d,R=D.ref,ser=D.ser[id]||{},rec=d=>ser[d]||{};
  const f0=rec(R).f||0,f1=rec(addDays(R,-1)).f||0;
  const last3=[0,1,2].map(i=>rec(addDays(R,-i)));
  return{on:Math.max(f0,f1)>=300,y:f0/1000,y1:f1/1000,none3:last3.every(x=>!(x.f>0))&&last3.some(x=>x.m>0)};
}
const ixIssueOf=id=>IXL?IXL.issues.find(i=>i.id===id&&(i.t==='ear'||i.t==='nr')):null;
function stBadge(c){

  const warn=iss?` UWAGA: ${iss.msg} Sprawdź, czy to na pewno ta krowa.`:'';
  const sw=g!=='g1'?stWrongInfo(c):null;
  if(sw)return `<span class="stb bad" title="Pobiera paszę ze stacji po przeniesieniu (${fD2(IX.d.ref)} ${fNum(sw.y)} kg), a w aplikacji nie jest w Grupie 1. ${esc(moveTxt(c))}.${esc(warn)}">S!</span>`;
  if(st.on&&g!=='g1')return '';

}

    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');const k=e.dataTransfer.getData('text/plain');const c=S.farm.cows[k];if(c)moveCows([c],col.dataset.g,'ręcznie')});
  });
  bindTouchDrag(board);
}
/* przeciąganie palcem (telefon/tablet): przytrzymaj ~0,35 s, przeciągnij na nazwę grupy lub kolumnę */
function bindTouchDrag(board){
  let timer=null,start=null,card=null,ghost=null,target=null,dragging=false;
  const findTarget=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('[data-mc],.col')};
  const clear=()=>{clearTimeout(timer);timer=null;
    if(ghost)ghost.remove();ghost=null;if(card)card.classList.remove('dragging');
    document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
    dragging=false;card=null;target=null};
  board.addEventListener('contextmenu',e=>{if(e.target.closest('.cow'))e.preventDefault()});
  board.addEventListener('touchstart',e=>{
    if(S.selMode||e.touches.length!==1)return;
    const el=e.target.closest('.cow');if(!el)return;
    const t0=e.touches[0];start={x:t0.clientX,y:t0.clientY};card=el;
    timer=setTimeout(()=>{
      dragging=true;card.classList.add('dragging');
      ghost=card.cloneNode(true);ghost.id='dragGhost';ghost.classList.remove('dragging');
      ghost.style.left=start.x+'px';ghost.style.top=start.y+'px';document.body.appendChild(ghost);
      if(navigator.vibrate)try{navigator.vibrate(25)}catch(_){}
    },350);
  },{passive:true});
  board.addEventListener('touchmove',e=>{
    const t1=e.touches[0];
    if(!dragging){if(start&&Math.hypot(t1.clientX-start.x,t1.clientY-start.y)>8){clearTimeout(timer);timer=null;card=null}return}
    e.preventDefault();
    ghost.style.left=t1.clientX+'px';ghost.style.top=t1.clientY+'px';
    const tg=findTarget(t1.clientX,t1.clientY);
    if(tg!==target){if(target)target.classList.remove('drop');target=tg;if(target)target.classList.add('drop')}
  },{passive:false});
  const end=()=>{
    if(dragging){
      S.noClickUntil=Date.now()+500;
      const k=card&&card.dataset.k,g=target&&(target.dataset.mc||target.dataset.g);
      clear();
      const c=k&&S.farm.cows[k];
      if(c&&g&&g!==gOf(c)){S.mobCol=g;moveCows([c],g,'ręcznie (przeciągnięcie)')}
    }else clear();
  };
  board.addEventListener('touchend',end);board.addEventListener('touchcancel',clear);
}

function wozCowStats(w){
  if(!ixHas())return[];
  const D=IX.d,R=D.ref,d7=dRange(addDays(R,-6),R);
  return wozCows(w).map(c=>{const L=lac(c),id=L.id;if(!id)return null;const ser=D.ser[id]||{};

/* rodzaj paszy (kolor wiersza): o = objętościowa, t = treściwa, m = mineralna/dodatek */
function wozTyp(f){if(f.typ)return f.typ;const n=(f.n||'').toLowerCase();if(/witamin|bufor|kred|sól|sol |mineral|premiks|premix|drożdż|soda|mocznik/.test(n))return'm';return(f.sm!=null&&f.sm<50)||/kiszon|sianokisz|trawa|słom|siano|lucern|wysłod|młóto/.test(n)?'o':'t'}

function wozUnits(f,kg){
  const u=f.u;if(!u||!u.t||u.t==='kg'||!(u.kg>0))return null;
  const step=u.half?u.kg/2:u.kg,n=Math.round(kg/step)*step/u.kg;if(n<=0)return null; // mniej niż najmniejsza porcja – odważyć w kg
  const whole=Math.floor(n),half=n-whole>0.25;
  const num=(whole?whole:'')+(half?'½':'');
  const forms=UNITS[u.t];const word=forms?plN(whole,forms[0],forms[1],forms[2],half?forms[3]:null):esc(u.n||'szt.');
  return{txt:`${num} ${word}`,kg:n*u.kg,size:u.kg};
}
function wozCalc(W,w){

  return{n,rows,kgS,smS,cost,tot:cum};
}

function bindPD(dates){
  const dz=$('#dz'),fi=$('#pdFile');
  fi.onchange=()=>fi.files[0]&&readPDFile(fi.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readPDFile(f)};
  if(S.pending)showPreview();
  if(dates.length){
    $('#pdSel').onchange=e=>{S.pdDate=e.target.value;render()};
    $('#pdDel').onclick=async()=>{if(!confirm(`Usunąć próbny dój z ${fDate(S.pdDate)}? Dane krów zostają.`))return;
      if(await commit({delTest:S.pdDate})){delete S.farm.tests[S.pdDate];S.pdDate=null;toast('Usunięto');render()}};
    renderAnalysis();
  }

function readPDFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
      const p=parseSOL(rows);
      if(p.error){S.pending=null;$('#pdPreview').innerHTML=`<p class="bad" style="margin-top:12px">${esc(p.error)}</p>`;return}
      p.fileName=file.name;S.pending=p;showPreview();
    }catch(err){$('#pdPreview').innerHTML=`<p class="bad">Nie udało się odczytać pliku: ${esc(err.message)}</p>`}
  };
  r.readAsArrayBuffer(file);
}
function showPreview(){
  const p=S.pending,cows=S.farm.cows;
  const inFile=new Set(p.rows.map(r=>r.kolczyk));
  const nowe=p.rows.filter(r=>!cows[r.kolczyk]);
  const brakWyn=p.rows.filter(r=>r.kg===null);
  const absent=Object.values(cows).filter(c=>c.aktywna!==false&&!inFile.has(c.kolczyk));
  const exists=!!S.farm.tests[p.testDate];
  $('#pdPreview').innerHTML=`<div style="margin-top:14px">
    <div class="kpis">
      <div class="kpi"><span class="muted">Data próbnego doju</span><b>${fDate(p.testDate)}</b></div>

      <div class="kpi"><span class="muted">Nowe krowy</span><b>${nowe.length}</b></div>
    </div>
    ${p.owner&&p.owner.toLowerCase()!==S.farm.name.toLowerCase()?`<p class="warn">Plik jest dla użytkownika „${esc(p.owner)}”, a ta aplikacja jest dla gospodarstwa „${esc(S.farm.name)}”. Sprawdź, czy to właściwy plik.</p>`:''}
    ${exists?`<p class="warn">Próbny dój z ${fDate(p.testDate)} jest już zapisany. Zapis go nadpisze.</p>`:''}
    ${brakWyn.length?`<p class="muted">Bez wyników: ${brakWyn.map(r=>`${esc(r.nr??r.kolczyk)}${r.info?' ('+esc(r.info)+')':''}`).join(', ')}</p>`:''}
    ${p.warnings.map(w=>`<p class="warn">${esc(w)}</p>`).join('')}
    ${absent.length?`<p><b>${absent.length}</b> krów z bazy nie ma w pliku: ${absent.map(c=>esc(c.nr??c.kolczyk)).join(', ')}.<br>
      <label><input type="checkbox" id="markGone"> Oznacz je jako usunięte ze stada</label></p>`:''}
    <div class="row"><span class="spacer"></span><button class="btn" id="pdCancel">Anuluj</button><button class="btn pri" id="pdSave">Zapisz próbny dój</button></div></div>`;
  $('#pdCancel').onclick=()=>{S.pending=null;$('#pdPreview').innerHTML=''};
  $('#pdSave').onclick=async()=>{
    // Import zapisuje TYLKO pola z pliku. Grupa, przypięcie, notatki i planowane wycielenie zostają nietknięte.
    const at=nowISO(),patches=[];
    p.rows.forEach(r=>{
      const c=cows[r.kolczyk];
      const f={nr:r.nr??c?.nr??null,nazwa:r.nazwa||c?.nazwa||'',aktywna:true,updatedAt:at};
      if(!c){f.kolczyk=r.kolczyk;f.grupa=null;f.createdAt=at}
      // wycielenie i laktacja z pliku tylko, gdy nie są starsze niż wpisane ręcznie
      if(!c||!c.dataWyc||(r.dataWyc&&r.dataWyc>=c.dataWyc)){if(r.dataWyc)f.dataWyc=r.dataWyc;if(r.lakt!=null)f.lakt=r.lakt}
      if(!c||!c.ostPd||p.testDate>=c.ostPd.date)f.ostPd={date:p.testDate,kg:r.kg,tl:r.tl,bi:r.bi,tb:r.tb,moc:r.moc,lks:r.lks,sket:r.sket,info:r.info};
      patches.push({k:r.kolczyk,f});
    });
    if($('#markGone')&&$('#markGone').checked)absent.forEach(c=>patches.push({k:c.kolczyk,f:{aktywna:false,updatedAt:at}}));
    const test={date:p.testDate,fileName:p.fileName||'',importedAt:at,owner:p.owner||'',rows:p.rows};
    $('#pdSave').disabled=true;

      toast(`Zapisano próbny dój z ${fDate(test.date)}: ${p.rows.length} krów`);render();
    }else $('#pdSave').disabled=false;
  };
}

/* ================== INFODEX: MAGAZYN I DANE ================== */
const IXDB={
  _db:null,
  open(){
    if(this._db)return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      if(!window.indexedDB)return rej(new Error('Przeglądarka nie obsługuje IndexedDB'));
      const r=indexedDB.open('grformela-ix-'+FARM.id,1);
      r.onupgradeneeded=()=>{const d=r.result;['kv','days'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
      r.onsuccess=()=>{this._db=r.result;res(r.result)};
      r.onerror=()=>rej(r.error);
    });
  },
  async getAll(store){
    const d=await this.open();
    return new Promise((res,rej)=>{const out={};const rq=d.transaction(store,'readonly').objectStore(store).openCursor();
      rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)});
  },
  async putMany(store,obj){
    const d=await this.open();
    return new Promise((res,rej)=>{const tx=d.transaction(store,'readwrite');const st=tx.objectStore(store);
      for(const k in obj)st.put(obj[k],k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
  }
};
const IX={meta:null,herd:null,events:[],days:{},feed:null,d:null,loading:false};
const EVN={1:'Ruja',2:'Inseminacja',3:'Badanie ciąży',4:'Zasuszenie',5:'Wycielenie',6:'Leczenie',7:'Podanie leku',8:'Wprowadzenie do stada',9:'Usunięcie ze stada'};
const med=a=>{const v=a.filter(x=>x!==null&&x!==undefined&&!isNaN(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2};
const fD2=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7):'–';
const WD=['nd','pn','wt','śr','cz','pt','sb'];
const wday=iso=>WD[new Date(iso+'T12:00:00').getDay()];
const normEar=s=>String(s||'').replace(/\s/g,'').toUpperCase();
const pct=(a,b)=>a!=null&&b?Math.round((a/b-1)*100):null;
/* obroża: wartość przeliczona na pełną dobę, gdy zapisano co najmniej min z 12 dwugodzinnych okresów */
const perDay=(x,f,nf,min=10)=>x&&x[nf]>=min&&x[f]!=null?x[f]*12/x[nf]:null;

async function ixLoad(){
  if(IX.loading)return;IX.loading=true;
  try{
    let kv={},days={};
    try{kv=await IXDB.getAll('kv');days=await IXDB.getAll('days')}catch(e){console.warn('IX cache',e)}
    if(kv.meta){IX.meta=kv.meta;IX.herd=kv.herd||null;IX.events=(kv.events&&kv.events.list)||[];IX.feed=kv.feed||null;IX.days=days;ixBuild();ixRerender()}
    if(!LOCAL&&db){
      const fr=db.collection('farms').doc(S.farmId);
      const ms=await fr.collection('ix').doc('meta').get();
      if(ms.exists){
        const m=ms.data();
        if(!kv.meta||kv.meta.at!==m.at||kv.meta.imported!==m.imported){
          const [h,e,fd]=await Promise.all([fr.collection('ix').doc('herd').get(),fr.collection('ix').doc('events').get(),fr.collection('ix').doc('feed').get()]);
          const known=Object.keys(days).sort();
          let q=fr.collection('ix_days');
          // agent wysyła 10 ostatnich dni – pobieram tylko je (mniej odczytów z bazy)
          if(kv.meta&&known.length)q=q.where('date','>=',addDays(known[known.length-1],-11));
          const ds=await q.get();
          const nd={};ds.forEach(x=>{nd[x.id]=x.data()});
          Object.assign(days,nd);
          IX.meta=m;IX.herd=h.exists?h.data():null;IX.events=e.exists?(e.data().list||[]):[];IX.days=days;IX.feed=fd.exists?fd.data():null;
          try{await IXDB.putMany('days',nd);await IXDB.putMany('kv',{meta:m,herd:IX.herd,events:{list:IX.events},feed:IX.feed})}catch(err){console.warn(err)}
          ixBuild();ixRerender();
        }
      }
    }
  }catch(e){console.error(e);toast('Nie udało się pobrać danych z Infodexu: '+e.message,5000)}
  finally{IX.loading=false}
}
function ixRerender(){if(S.farm&&['dzis','zyw','grupy','stado','woz'].includes(S.tab)&&!$('#modalRoot .modal'))render()}
const ixHas=()=>!!(IX.d&&IX.d.dates.length);

function ixBuild(){
  const D={};IX.d=D;
  const meta=IX.meta||{};
  D.dates=Object.keys(IX.days).sort();
  const exp=(meta.at||'').slice(0,10);
  // dzień eksportu liczy się jako pełny, gdy agent działał po 22:00 (codziennie o 23:59)
  const full=(meta.at||'').slice(11,13)>='22';
  D.ref=[...D.dates].reverse().find(d=>!exp||d<exp||(full&&d===exp))||D.dates[D.dates.length-1]||null;
  IX.fp=undefined;LACC.clear();
  const ser={};
  for(const dt of D.dates){const c=(IX.days[dt]||{}).c||{};for(const id in c)(ser[id]=ser[id]||{})[dt]=c[id]}
  D.ser=ser;
  const ev={};(IX.events||[]).forEach(e=>{(ev[e.c]=ev[e.c]||[]).push(e)});
  Object.values(ev).forEach(l=>l.sort((a,b)=>a.d.localeCompare(b.d)));
  D.ev=ev;D.lact={};D.curves=null;
  // dzienne podsumowanie stada
  D.herdDay={};
  for(const dt of D.dates){
    const c=IX.days[dt].c||{};let tot=0,n=0,un=0,both=0;
    for(const id in c){const m=c[id].m;if(!m)continue;if(id==='0'){un+=m;continue}tot+=m;n++;if(c[id].m1>0&&c[id].m2>0)both++}
    D.herdDay[dt]={tot:tot+un,cows:n,avg:n?tot/n:null,un,both};
  }
  // ochrona przed niepełnym dniem (np. brak porannego udoju w danych): weź poprzedni pełny dzień
  D.skip=null;
  {const R0=D.ref,h0=D.herdDay[R0];const pv=dRange(addDays(R0,-7),addDays(R0,-1)).map(d=>D.herdDay[d]).filter(x=>x&&x.cows>0);
   if(h0&&pv.length>=4){const mt=med(pv.map(x=>x.tot)),mb=med(pv.map(x=>x.both||0));
    if(h0.tot<mt*0.8){const p=[...D.dates].reverse().find(d=>d<R0&&D.herdDay[d]&&D.herdDay[d].cows>0);
      if(p){D.skip={d:R0,tot:h0.tot,mt,both:h0.both||0,mb};D.ref=p}}}}
}
const ixCows=()=>(IX.herd&&IX.herd.cows)||{};
const ixRec=(id,dt)=>IX.d&&IX.d.ser[id]&&IX.d.ser[id][dt]||null;
const dRange=(a,b)=>{const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out};

/* dopasowanie krów Infodexu do krów w aplikacji: po kolczyku, awaryjnie po numerze */
function ixLinks(){
  const app=S.farm.cows,herd=ixCows();
  const L={ix2app:{},app2ix:{},issues:[]};const used=new Set();
  for(const id in herd){const e=normEar(herd[id].ear);if(e&&app[e]){L.ix2app[id]=e;L.app2ix[e]=id;used.add(e)}}
  const byNr={};Object.values(app).forEach(c=>{if(c.aktywna!==false&&c.nr!=null&&!used.has(c.kolczyk))byNr[c.nr]=c.kolczyk});
  for(const id in herd){if(L.ix2app[id])continue;const k=byNr[+id];
    if(k){L.ix2app[id]=k;L.app2ix[k]=id;used.add(k);L.issues.push({t:'ear',id,k,msg:`Krowa ${id}: kolczyk w Infodexie (${herd[id].ear||'brak'}) różni się od kolczyka z próbnego doju (${k}). Połączono po numerze.`})}}
  for(const id in herd){const k=L.ix2app[id];if(k&&app[k].nr!=null&&String(app[k].nr)!==String(id))L.issues.push({t:'nr',id,k,msg:`Kolczyk ${k}: w Infodexie to krowa nr ${id}, a w próbnym doju nr ${app[k].nr}.`})}
  for(const id in herd)if(!L.ix2app[id])L.issues.push({t:'noapp',id,msg:`Krowa ${id} (${herd[id].ear||'bez kolczyka'}) jest w Infodexie, ale nie ma jej w aplikacji.`});
  Object.values(app).forEach(c=>{if(c.aktywna!==false&&!L.app2ix[c.kolczyk])L.issues.push({t:'noix',k:c.kolczyk,msg:`Krowa ${c.nr??'?'} (${c.kolczyk}) jest w aplikacji, ale nie ma jej w Infodexie.`})});
  return L;
}
let IXL=null;

/* bieżąca laktacja z Infodexu: najpóźniejsza z dat wycielenia (zdarzenie, raport dzienny, karta krowy) */
function ixLacId(id){
  const D=IX.d,h=ixCows()[id];if(!D||!h)return null;
  const T=todayISO();
  const calvs=((D.ev[id])||[]).filter(e=>e.t===5).map(e=>e.d.slice(0,10)).sort();
  const ser=D.ser[id]||{},ds=Object.keys(ser).sort();
  let cdS=null;for(let i=ds.length-1;i>=0&&i>=ds.length-30;i--){const x=ser[ds[i]];if(x.dim!=null&&x.dim>=0){cdS=addDays(ds[i],-x.dim);break}}
  const hAt=((IX.herd&&IX.herd.at)||(IX.meta&&IX.meta.at)||'').slice(0,10);
  const cdH=h.dim!=null&&h.dim>=0&&hAt?addDays(hAt,-h.dim):null;
  const c=[calvs[calvs.length-1],cdS,cdH].filter(x=>x&&x<=T).sort();
  return{cd:c.length?c[c.length-1]:null,calvs,calv:h.calv||0,dry:h.state===3};
}

/* rozród */
function ixRepro(id){
  const s=S.farm.settings,h=ixCows()[id]||{},ev=(IX.d&&IX.d.ev[id])||[];
  const ins=ev.filter(e=>e.t===2),calv=ev.filter(e=>e.t===5),pt=ev.filter(e=>e.t===3);
  const lastCalv=calv.length?calv[calv.length-1].d.slice(0,10):null;
  const insAfter=ins.filter(e=>!lastCalv||e.d.slice(0,10)>lastCalv);
  const lastIns=insAfter.length?insAfter[insAfter.length-1].d.slice(0,10):null;
  const ptAfter=pt.filter(e=>lastIns&&e.d.slice(0,10)>lastIns);
  const lastPt=pt.length?pt[pt.length-1]:null;
  const pregnant=h.state===2||h.state===3;
  let expCalv=null;
  if(pregnant){
    const pos=[...pt].reverse().find(e=>e.r===s.kodCiazy&&(!lastCalv||e.d.slice(0,10)>lastCalv));
    const base=pos?[...insAfter].reverse().find(e=>e.d<pos.d):null;
    const insD=base?base.d.slice(0,10):lastIns;
    if(insD)expCalv=addDays(insD,s.ciaza);
  }
  const k=IXL&&IXL.ix2app[id],ac=k&&S.farm.cows[k];
  if(ac&&ac.plWyc)expCalv=ac.plWyc;
  const vwp=s.vwp;
  const stTxt={0:'jałówka',1:'po inseminacji',2:'cielna',3:'zasuszona',5:(h.dim!=null&&h.dim<vwp?'po wycieleniu':'pusta, do krycia')}[h.state]??'–';
  return{lastCalv,lastIns,insCount:insAfter.length,ptAfter,lastPt,pregnant,expCalv,stTxt,state:h.state};
}

/* laktacje krowy z danych dziennych (data wycielenia = dzień − dzień laktacji) */
function ixLact(id){
  const D=IX.d;if(D.lact[id])return D.lact[id];
  const ser=D.ser[id]||{},segs=[];
  for(const dt of Object.keys(ser).sort()){if(dt>D.ref)continue;
    const r=ser[dt];if(!r.m||r.dim==null||r.dim<0)continue;
    const cd=addDays(dt,-r.dim);
    let sg=segs[segs.length-1];
    // nowa laktacja tylko gdy data wycielenia przesunęła się o > 200 dni; mniejsze różnice to poprawki daty w Infodexie
    if(!sg||dayDiff(sg.cd,cd)>200){sg={cd,pts:[]};segs.push(sg)}
    sg.cd=cd;sg.pts.push({m:r.m,dt});
  }
  segs.forEach(sg=>{sg.pts=sg.pts.map(p=>({...p,dim:dayDiff(sg.cd,p.dt)})).filter(p=>p.dim>=0)});
  const h=ixCows()[id]||{};
  const k=IXL&&IXL.ix2app[id],ac=k&&S.farm.cows[k];
  const cur=Math.max(h.calv||0,(ac?lac(ac).lakt:0)||0)||null;
  segs.forEach((sg,i)=>{sg.lakt=cur?cur-(segs.length-1-i):null});
  // numer laktacji < 1 oznacza dane innego zwierzęcia pod tym samym numerem (numer użyty ponownie po brakowaniu)
  const own=segs.filter(sg=>sg.lakt==null||sg.lakt>=1);
  D.lact[id]=own;return own;
}
/* krzywe laktacji stada: pierwiastki / wieloródki, średnie tygodniowe */
function ixCurves(){
  const D=IX.d;if(D.curves)return D.curves;
  const W=44,acc={p:[],w:[]};
  for(let i=0;i<W;i++){acc.p.push([]);acc.w.push([])}
  let nP=0,nW=0;
  for(const id in D.ser){if(id==='0')continue;
    for(const sg of ixLact(id)){
      const cls=sg.lakt===1?'p':(sg.lakt?'w':null);if(!cls)continue;
      const wk={};sg.pts.forEach(p=>{const w=Math.floor(p.dim/7);if(w<W)(wk[w]=wk[w]||[]).push(p.m)});
      let used=false;for(const w in wk){if(wk[w].length>=3){acc[cls][w].push(avg(wk[w]));used=true}}
      if(used)cls==='p'?nP++:nW++;
    }
  }
  const mk=a=>a.map(l=>l.length>=3?{v:avg(l),n:l.length}:null);

function curveStats(cv){
  const sm=cv.map((x,i)=>{const l=[cv[i-1],x,cv[i+1]].filter(Boolean).map(y=>y.v);return x&&l.length?avg(l):null});
  let pw=-1,pk=null;sm.forEach((v,i)=>{if(v!=null&&i<=20&&(pk==null||v>pk)){pk=v;pw=i}});
  if(pw<0)return null;
  const xs=[],ys=[];for(let i=pw+4;i<=Math.min(pw+30,cv.length-1);i++)if(cv[i]){xs.push(i);ys.push(cv[i].v)}
  let slope=null;
  if(xs.length>=5){const mx=avg(xs),my=avg(ys);let a=0,b=0;xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)**2});slope=a/b}
  const perMonth=slope!=null?-slope*30/7:null;
  return{peak:pk,peakWeek:pw+1,perMonth,perMonthPct:perMonth!=null?perMonth/pk*100:null};
}
function curveAt(cls,dimv){
  const cv=ixCurves()[cls];if(!cv||dimv==null)return null;
  const x=dimv/7-0.5,i=Math.floor(x),f=x-i;
  const a=cv[Math.max(0,Math.min(cv.length-1,i))],b=cv[Math.max(0,Math.min(cv.length-1,i+1))];
  if(a&&b)return a.v+(b.v-a.v)*f;return(a||b)?(a||b).v:null;
}

function ixAlerts(){

        const rp=ixRepro(id);

          heats.push({id,ch:Math.round(ch),st:Math.round(sv),sm,rp,dim:dimR,since:rp.lastIns?daysSinceIns:null});
      }
    }
    if(dimR!=null&&dimR>=4&&dimR<=21){
      const l3=[0,1,2].map(i=>ser[addDays(R,-i)]&&ser[addDays(R,-i)].m).filter(x=>x>0);
      const p3=[3,4,5].map(i=>ser[addDays(R,-i)]&&ser[addDays(R,-i)].m).filter(x=>x>0);
      if(l3.length>=2&&p3.length>=2&&avg(l3)<avg(p3)*0.95&&avg(p3)-avg(l3)>=1.5){reasons.push({c:'r',t:`świeża (${dimR} dzień), mleko spada zamiast rosnąć: ${fNum(avg(p3))} → ${fNum(avg(l3))} kg`});sev+=3}

/* ================== RUJA: aktywność z ostatnich 12 godzin (kroki co 2 h) ================== */
/* Porównuję kroki z ostatnich 12 h z tymi samymi godzinami w 7 poprzednich dniach (każda krowa ze swoją normą).
   Bez danych co 2 h (stary agent) – reguła dobowa z ixAlerts. */
function ixHeats(){
  const D=IX.d,herd=ixCows(),T=todayISO();
  // najnowszy zapis kroków w stadzie
  let T0=null;
  for(const d of [...D.dates].reverse().slice(0,3)){
    const c=(IX.days[d]||{}).c||{};let mi=-1;
    for(const id in c){const sa=c[id].sa;if(!sa)continue;for(let i=11;i>mi;i--)if(sa[i]!=null){mi=i;break}}
    if(mi>=0){T0={d,i:mi};break}
  }
  if(!T0)return{mode:'day',list:ixAlerts().heats.map(h=>({...h,daily:true})),T0:null};
  const slot=(ser,d,i)=>{while(i<0){i+=12;d=addDays(d,-1)}while(i>11){i-=12;d=addDays(d,1)}const sa=ser[d]&&ser[d].sa;return sa?sa[i]:null};
  const win=(ser,d,i,n)=>{let s=0,k=0;for(let j=0;j<n;j++){const v=slot(ser,d,i-j);if(v!=null){s+=v;k++}}return k>=n-1?s*n/k:null};
  const list=[];
  for(const id in herd){
    const h=herd[id];if(h.state===2||h.state===3)continue;
    const ser=D.ser[id]||{};
    const cur=win(ser,T0.d,T0.i,6);if(cur==null)continue;
    const base=[1,2,3,4,5,6,7].map(k=>win(ser,addDays(T0.d,-k),T0.i,6)).filter(v=>v!=null);
    if(base.length<4)continue;
    const bm=med(base);if(!(bm>0))continue;
    const ratio=cur/bm;
    if(!(ratio>=1.7&&cur-bm>=40))continue;
    // początek wzrostu: idę wstecz od najnowszego zapisu, dopóki 2-godzinne okresy są podwyższone (1 przerwa dozwolona)
    let on=null,gap=0;
    for(let j=0;j<12;j++){
      const v=slot(ser,T0.d,T0.i-j);
      const sm=med([1,2,3,4,5,6,7].map(k=>slot(ser,addDays(T0.d,-k),T0.i-j)).filter(x=>x!=null));
      const up=v!=null&&sm!=null&&v>=Math.max(sm*1.8,sm+8);
      if(up){on=j;gap=0}else if(++gap>1)break;
    }
    let od=T0.d,oi=T0.i-(on??0);while(oi<0){oi+=12;od=addDays(od,-1)}
    const onset=`${od}T${String(oi*2).padStart(2,'0')}:00`;
    const rp=ixRepro(id);
    const since=rp.lastIns?dayDiff(rp.lastIns,T):null;
    if(since!=null&&since<=2)continue;
    const dimv=(()=>{const x=ixLacId(id);return x&&x.cd?dayDiff(x.cd,T):h.dim})();
    list.push({id,ratio,cur,bm,onset,rp,dim:dimv,since});
  }
  list.sort((a,b)=>b.ratio-a.ratio);
  return{mode:'h',list,T0};
}

const thiOf=(T,RH)=>(1.8*T+32)-(0.55-0.0055*RH)*(1.8*T-26);
let WX=null,WXerr=null,WXbusy=null;
function wxGet(){
  if(WX)return Promise.resolve(WX);
  if(WXbusy)return WXbusy;
  WXbusy=(async()=>{
    const s=S.farm.settings,key='grformela.wx.v1';
    let c=null;try{c=JSON.parse(localStorage.getItem(key))}catch(e){}
    if(c&&c.lat===s.lat&&c.lon===s.lon&&Date.now()-c.t<6*3600e3){WX=c.days;return WX}
    const days={};
    const add=j=>{const d=j&&j.daily;if(!d)return;d.time.forEach((t,i)=>{const T=d.temperature_2m_max[i],RH=d.relative_humidity_2m_mean[i];if(T!=null&&RH!=null)days[t]={t:T,rh:RH,thi:thiOf(T,RH)}})};
    const base=`latitude=${s.lat}&longitude=${s.lon}&daily=temperature_2m_max,relative_humidity_2m_mean&timezone=Europe%2FWarsaw`;
    const first=(IX.d&&IX.d.dates[0])||addDays(todayISO(),-365),endA=addDays(todayISO(),-7);
    try{if(first<endA){const r=await fetch(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${first}&end_date=${endA}`);if(r.ok)add(await r.json())}}catch(e){console.warn(e)}
    const r2=await fetch(`https://api.open-meteo.com/v1/forecast?${base}&past_days=14&forecast_days=4`);
    if(!r2.ok)throw new Error('serwis pogody odpowiedział '+r2.status);
    add(await r2.json());
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),lat:s.lat,lon:s.lon,days}))}catch(e){}
    WX=days;return WX;
  })().catch(e=>{WXerr=e.message;throw e}).finally(()=>{WXbusy=null});
  return WXbusy;
}

  return sk+`<div class="fresh${old?' old':''}"><span>Dane z Infodexu: pełne dni do <b>${fDate(D.ref)}</b>${at?` · ostatnia wysyłka z obory <b>${fD2(atD)} ${esc(at.slice(11,16))}</b>`:''}</span><span class="spacer"></span>

}

/* ---------- plan dawek stacji z Infodexu (FeedingNew → FeedingDayPoints → FeedingInstructions) ---------- */
const csvT=s=>{if(!s)return[];const L=String(s).split('\n');const h=L[0].split(',');return L.slice(1).filter(x=>x.trim()).map(l=>{const v=l.split(',');const o={};h.forEach((k,i)=>{const x=v[i];o[k]=x===''||x==null?null:(isNaN(+x)?x:+x)});return o})};
function ixFeedPlan(){
  if(IX.fp!==undefined)return IX.fp;
  IX.fp=null;
  const t=IX.feed&&IX.feed.tables;if(!t)return null;
  const FN=csvT(t.FeedingNew),PT=csvT(t.FeedingDayPoints),IN=csvT(t.FeedingInstructions);
  const P={rows:{},raw:t,pts:{},ins:{},byCow:{},byGroup:{},mode:'id',scale:1,ok:false,n:0,ratio:null,mt:false};
  Object.keys(t).forEach(k=>{P.rows[k]=csvT(t[k]).length});
  PT.forEach(p=>{(P.pts[p.FeedingId]=P.pts[p.FeedingId]||[]).push(p)});Object.values(P.pts).forEach(l=>l.sort((a,b)=>a.Day-b.Day));
  IN.forEach(x=>{(P.ins[x.PointId]=P.ins[x.PointId]||[]).push(x);if(x.YieldKey>0)P.mt=true});
  // mleko w tabeli mlecznej: kg (gdyby Infodex trzymał je w dziesiątych/gramach – przeskaluj)
  const yk=Math.max(0,...IN.map(x=>x.YieldKey||0));P.yks=yk>1500?1000:yk>150?10:1;if(P.yks>1)IN.forEach(x=>{if(x.YieldKey)x.YieldKey=x.YieldKey/P.yks});
  const pick=(o,k,r)=>{const cur=o[k];if(!cur||(cur.IsParlour&&!r.IsParlour))o[k]=r};
  FN.forEach(r=>{if(r.CowId!=null)pick(P.byCow,String(r.CowId),r);else if(r.GroupId!=null)pick(P.byGroup,String(r.GroupId),r)});
  IX.fp=P;
  if(!FN.length||!PT.length||!IN.length)return P;
  // FeedingNew.CowId = numer krowy w Infodexie (sprawdzone 10.2026); wariant DbId tylko gdy wyraźnie lepiej pasuje
  const herd=ixCows(),ids=Object.keys(herd);
  const hit=m=>ids.filter(id=>P.byCow[m==='db'?String(herd[id].dbid):id]).length;
  P.mode=hit('db')>hit('id')*1.5?'db':'id';
  // dawki w Infodexie są w gramach; porównanie z faktycznym pobraniem tylko informacyjnie
  const D=IX.d,d7=dRange(addDays(D.ref,-6),D.ref),ratios=[];let n=0;
  for(const id of ids){const L=ixLacOf(id),raw=planRaw(P,id,L,ixMilk7(id));if(raw!=null)n++;
    const ser=D.ser[id]||{},f=d7.map(d=>ser[d]&&ser[d].f).filter(x=>x>0);
    if(f.length>=4&&raw>0)ratios.push(avg(f)/raw)}
  P.n=n;P.ratio=ratios.length>=3?med(ratios):null;P.ok=n>0;
  return P;
}
function ixLacOf(id){const k=IXL&&IXL.ix2app[id],c=k&&S.farm.cows[k];if(c)return lac(c);const x=ixLacId(id);return{dim:x&&x.cd?dayDiff(x.cd,todayISO()):null,zas:(ixCows()[id]||{}).lc===3}}
/* typy węzłów (Infodex FeedingDayPoints.Type): 0 = przed laktacją (Day -1), 1 = wg dnia laktacji, 4 = przed zasuszeniem; tabela mleczna = instrukcje z YieldKey > 0 */
function planNodes(P,id){
  const h=ixCows()[id]||{};
  const own=P.byCow[P.mode==='db'?String(h.dbid):id],grp=h.grp!=null?P.byGroup[String(h.grp)]:null;
  // typ żywienia 1 = grupowe: wzorzec grupy (krowa może mieć stary wzorzec indywidualny, nieużywany)
  const plan=h.feedType===1?(grp||own):(own||grp);
  return plan?(P.pts[plan.Id]||[]):null;
}
function nodeVal(P,pt,milk){
  let ins=P.ins[pt.Id]||[];const f1=ins.filter(x=>!x.FoodIndex);if(f1.length)ins=f1;if(!ins.length)return null;
  const tab=ins.filter(x=>x.YieldKey>0||ins.length>1).sort((a,b)=>(a.YieldKey||0)-(b.YieldKey||0));
  if(tab.length<2)return ins.reduce((a,x)=>a+(x.Value||0),0);
  if(milk==null)return tab[0].Value;
  if(milk<=tab[0].YieldKey)return tab[0].Value;
  for(let i=1;i<tab.length;i++){const a=tab[i-1],b=tab[i];if(milk<=b.YieldKey)return b.YieldKey>a.YieldKey?a.Value+(b.Value-a.Value)*(milk-a.YieldKey)/(b.YieldKey-a.YieldKey):b.Value}
  return tab[tab.length-1].Value;
}
function planRaw(P,id,L,milk){
  const pts=planNodes(P,id);if(!pts||!pts.length)return null;
  const pre=pts.find(p=>p.Type===0||p.Day<0),lact=pts.filter(p=>p!==pre&&p.Type!==4&&p.Day>=0);
  if(L&&(L.zas||L.dim==null))return pre?nodeVal(P,pre,null):null;
  if(!lact.length)return null;
  const dv=L.dim;let i=-1;lact.forEach((p,j)=>{if(p.Day<=dv)i=j});
  if(i<0){const a=pre?nodeVal(P,pre,null):0,b=nodeVal(P,lact[0],milk);return b}
  const a=lact[i],b=lact[i+1],va=nodeVal(P,a,milk);
  if(b&&b.Day>a.Day){const vb=nodeVal(P,b,milk);if(va!=null&&vb!=null)return va+(vb-va)*(dv-a.Day)/(b.Day-a.Day)}
  return va;
}
const planKg=(P,id,L,milk)=>{const r=planRaw(P,id,L,milk);return r==null?null:r/1000};
const ixPar=k=>{const p=IX.feed&&IX.feed.params;return p&&p[k]!=null?String(p[k]):null};
function feedLine(id){
  const F=ixFeedInfo(id);if(F.ft==null&&F.kg==null)return'';

  if(F.ft===0)return`<div class="muted">Stacja w Infodexie: <b class="bad">brak żywienia</b> – stacja nic tej krowie nie wyda${st}</div>`;
  return`<div class="muted">Stacja w Infodexie: żywienie ${esc(F.ftTxt||'?')}${F.kg!=null?`, dziś <b>${fNum(F.kg,1)} kg</b>`:''}${F.desc?` (${esc(F.desc)})`:''}${F.pre!=null?` · przed laktacją ${fNum(F.pre,1)} kg`:''}${st}</div>`;
}
const NE_KEY='grformela.neSnooze';
function neSnoozed(k){try{const o=JSON.parse(localStorage.getItem(NE_KEY)||'{}');return o[k]&&o[k]>=todayISO()}catch(e){return false}}
function neSnooze(k,days){try{const o=JSON.parse(localStorage.getItem(NE_KEY)||'{}');o[k]=addDays(todayISO(),days);localStorage.setItem(NE_KEY,JSON.stringify(o))}catch(e){}}
/* krowy z dawką w Infodexie, które wczoraj zjadły mniej niż połowę (alarm w Dziś; w Infodexie ten alarm jest wyłączony) */
function ixNotEating(){
  const P=ixFeedPlan();if(!P||!P.ok)return[];
  const D=IX.d,R=D.ref,out=[];
  // tylko Grupa 1 – pozostałe grupy nie mają dostępu do stacji
  for(const c of activeCows()){if(gOf(c)!=='g1')continue;const L=lac(c),id=L.id;if(!id||L.zas)continue;
    const h=ixCows()[id]||{};if(h.feedType===0)continue;
    if(neSnoozed(c.kolczyk)||dryingIds().has(id))continue;
    const ser=D.ser[id]||{},r0=ser[R]||{};if(!(r0.m>0))continue;
    const dose=planKg(P,id,L,ixMilk7(id));if(!(dose>=0.5))continue;
    const ok=d=>{const r=ser[d]||{};return !(r.m>0)||(r.f||0)/1000>=dose*0.5};
    if(ok(R))continue;
    let n=0;for(let i=0;i<30;i++){const d=addDays(R,-i);if(ok(d))break;n++}
    const f=(r0.f||0)/1000;if(n<2&&f>=0.1)continue; // jednodniowy niedojad bywa wyrównywany następnego dnia (przenoszenie paszy)
    out.push({c,id,dose,f,n,g:gOf(c)});
  }
  return out.sort((a,b)=>b.n-a.n||(a.c.nr??1e9)-(b.c.nr??1e9));
}
function notEatCard(){
  const l=ixNotEating();if(!l.length)return'';

    <p class="muted">Wczoraj nic nie zjadły albo od co najmniej 2 dni zjadają mniej niż połowę dawki z Infodexu, choć są dojone. <b>Czy któraś została przeprowadzona do Grupy 2 albo zasuszona?</b> Jeśli nie – sprawdź zdrowie, responder i dostęp do stacji.</p>
    <div class="alist">${l.map(x=>`<div class="aitem s${x.n>=3?3:2}">${nrLink(x.id)}<div class="ar"><div class="rs">wczoraj ${fNum(x.f,1)} z ${fNum(x.dose,1)} kg · ${x.n>1?`<b>od ${x.n} dni</b>`:'pierwszy dzień'}</div></div>
      <div class="nebtn"><button class="btn sm" data-ne="${esc(x.c.kolczyk)}|g2">do G2</button><button class="btn sm" data-ne="${esc(x.c.kolczyk)}|zas">zasuszona</button><button class="btn sm" data-ne="${esc(x.c.kolczyk)}|stay" title="Nie pytaj o tę krowę przez 7 dni">zostaje w G1</button></div></div>`).join('')}</div></div>`;
}
/* dawka w Infodexie a zasada (TMR + kg paszy na kg mleka) – lista do przestawienia */
function doseVsRule(){
  const P=ixFeedPlan(),s=S.farm.settings;if(!P||!P.ok)return null;
  const rule=m=>Math.max(0,(m-s.tmrMleko)*s.kgPaszyNaKgMleka);
  return activeCows().filter(c=>gOf(c)==='g1').map(c=>{const L=lac(c),id=L.id;if(!id||L.zas)return null;const m7=ixMilk7(id);if(m7==null)return null;
    const h=ixCows()[id]||{},dose=h.feedType===0?0:planKg(P,id,L,m7),r=rule(m7);
    return{c,id,nr:c.nr,dim:L.dim,m7,dose,rule:r,diff:dose!=null?dose-r:null,fresh:L.dim!=null&&L.dim<21}}).filter(Boolean).sort((a,b)=>Math.abs(b.diff??0)-Math.abs(a.diff??0));
}
/* kontrola kalibracji: dostawy paszy (SiloHistory) a suma wydana przez stacje */
function calibFromSilo(){
  const t=IX.feed&&IX.feed.tables;if(!t||!IX.d)return null;
  const D=IX.d,first=D.dates[0],last=D.ref;
  const sil=csvT(t.SiloHistory).filter(r=>(r.TotalVolume||0)>0).map(r=>({d:String(r.Date||'').slice(0,10),v:r.TotalVolume})).filter(x=>x.d>=first&&x.d<=last).sort((a,b)=>a.d.localeCompare(b.d));
  if(sil.length<3)return null;
  const from=sil[0].d,to=sil[sil.length-1].d,days=dRange(from,addDays(to,-1));
  const have=days.filter(d=>D.herdDay[d]).length;if(have<days.length*0.9)return null;
  let disp=0;for(const id in D.ser){if(id==='0')continue;const ser=D.ser[id];for(const d of days){const r=ser[d];if(r&&r.f>0)disp+=r.f/1000}}
  const del=sil.slice(0,-1).reduce((a,x)=>a+x.v,0);if(!(del>0&&disp>0))return null;
  const fs=csvT(t.FeedingStations),g0=(fs[0]&&fs[0].Forage1MotorRotationDose)||100,ratio=disp/del;
  return{from,to,n:sil.length-1,del,disp,ratio,g0,gpr:g0/ratio};
}

/* uwagi do ustawień stacji w Infodexie */
function feedSetupNotes(){

  {const cc=calibFromSilo();if(cc)out.push([Math.abs(cc.ratio-1)>0.08?'warn':'',`<b>Dostawy a wydanie stacji:</b> od ${fDate(cc.from)} do ${fDate(cc.to)} dowieziono ${fNum(cc.del/1000,1)} t (${cc.n} dostaw), a stacje według Infodexu wydały ${fNum(cc.disp/1000,1)} t (${fNum(cc.ratio*100,0)}%). ${Math.abs(cc.ratio-1)>0.08?`Jeśli przy dostawach zbiornik był podobnie pełny, stacja wydaje realnie około <b>${fNum(cc.gpr,0)} g na obrót</b>, a nie ${cc.g0} g, i kilogramy ze stacji są ${cc.ratio>1?'zawyżone':'zaniżone'} o ${fNum(Math.abs(cc.ratio-1)*100,0)}%.`:'Zgodność dobra: kalibracja wygląda na prawidłową.'} Porównanie przybliżone: zależy od stanu zbiornika w dniu dostawy.`])}
  if(ixPar('ShowNotEatingCowsAlarms')==='False')out.push(['warn','W Infodexie <b>wyłączony jest alarm o krowach, które nie jedzą paszy</b>. Hodowca nie widzi go na ekranie głównym. Włączenie: Ustawienia → Powiadomienia.']);
  const herd=ixCows(),L=ixL();
  const g1no=activeCows().filter(c=>gOf(c)==='g1').map(c=>({c,id:L.app2ix[c.kolczyk]})).filter(x=>x.id&&(herd[x.id]||{}).feedType===0);
  if(g1no.length)out.push(['bad',`W Grupie 1, a w Infodexie ustawione „Brak żywienia”: ${g1no.map(x=>'nr '+esc(x.c.nr)).join(', ')}.`]);

    const lv=activeCows().filter(c=>gOf(c)==='g1').map(c=>{const id=L.app2ix[c.kolczyk];return id?planKg(P,id,lac(c),ixMilk7(id)):null}).filter(v=>v!=null);
    if(lv.length){const mx=Math.max(...lv);out.push(['',`Dawki w Grupie 1: od ${fNum(Math.min(...lv),1)} do ${fNum(mx,1)} kg na dobę${P.mt?'':' (stałe dawki ustawione ręcznie, bez tabeli mlecznej i bez krzywej po wycieleniu)'}.`])}

/* opis wzorca żywienia krowy w Infodexie (do karty krowy) */

function rationCompare(date){

  const postAvail=post.filter(d=>d<=D.ref&&D.herdDay[d]).length;
  const rows={all:[],a:[],b:[],c:[]};const rum=[],feed=[];
  for(const id in D.ser){if(id==='0')continue;const ser=D.ser[id];
    const a=pre.map(d=>ser[d]&&ser[d].m).filter(x=>x>0),b=post.map(d=>ser[d]&&ser[d].m).filter(x=>x>0);
    if(a.length<5||b.length<5)continue;
    const dr=[...pre].reverse().map(d=>ser[d]&&ser[d].dim).find(x=>x!=null&&x>=0);if(dr==null)continue;
    const dimPre=dr-6.5,lk=(ixLact(id).slice(-1)[0]||{}).lakt,cls=lactCls(lk);
    const dt=skip+14,e0=curveAt(cls,dimPre),e1=curveAt(cls,dimPre+dt);
    const x={id,before:avg(a),after:avg(b),dim:dimPre,exp:e0!=null&&e1!=null?e1-e0:null};
    rows.all.push(x);rows[dr<100?'a':dr<200?'b':'c'].push(x);
    const ra=pre.map(d=>perDay(ser[d],'rum','nr')).filter(v=>v!=null),rb=post.map(d=>perDay(ser[d],'rum','nr')).filter(v=>v!=null);
    if(ra.length>=4&&rb.length>=4)rum.push((med(rb)/med(ra)-1)*100);
    const fa=pre.map(d=>ser[d]&&ser[d].f).filter(v=>v>0),fb=post.map(d=>ser[d]&&ser[d].f).filter(v=>v>0);
    if(fa.length>=4&&fb.length>=4)feed.push((avg(fb)-avg(fa))/1000);
  }
  const sum=l=>{if(!l.length)return null;const b=avg(l.map(x=>x.before)),a=avg(l.map(x=>x.after)),ex=avg(l.map(x=>x.exp));return{n:l.length,b,a,d:a-b,ex,net:ex!=null?a-b-ex:null}};
  return{pre,post,postAvail,skip,res:{all:sum(rows.all),a:sum(rows.a),b:sum(rows.b),c:sum(rows.c)},rum:rum.length>=5?{n:rum.length,v:med(rum)}:null,feed:feed.length>=3?{n:feed.length,v:avg(feed)}:null};
}
